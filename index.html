body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;min-height:100vh}

header b{font-size:18px}

nav button.on,nav button:hover{background:rgba(255,255,255,.2)}

.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:18px;margin-bottom:16px;overflow-x:auto}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>

/* =========== SETUP: Firebase config =========== */
const FIREBASE_CONFIG={
 apiKey:"AIzaSyBiQeudblgek02MQo1TsJSXoAAOw30CQgM",authDomain:"classroom-76d38.firebaseapp.com",projectId:"classroom-76d38",appId:"1:637359880930:web:b71459ae37f955d0783cbb"};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),col=n=>db.collection(n);

/* live copy of the database */
const D={},active={},dying=new Set();
const flat=p=>Object.keys(D).filter(k=>k.startsWith(p)).flatMap(k=>D[k]);
const S={
 get hosted(){return (D.hosted||[]).filter(s=>!dying.has(s.id))},
 get mine(){return D.mine||[]},
 get joined(){return flat('sec:')},
 get sections(){return [...this.hosted,...this.joined]},
 get materials(){return flat('mat:')},
 get activities(){return flat('act:')},
 get subs(){return [...flat('hsub:'),...(D.mysubs||[])]},
 get students(){return flat('mem:').map(m=>({id:m.student,mid:m.id,section:m.section,name:m.name,email:m.email}))}
};
let me=null,authed=null,loaded={},msg='',mode=null,joinInfo=null;
let tab='',draft=null,taking=null,trackSec='all',trackStu=null,pend=false;
let uploadedFileMeta=null,fileBusy=false;
let joinCode=(new URLSearchParams(location.search).get('join')||'').trim().toLowerCase()||null;
const LEVELS=['Beginner','Intermediate','Advanced'];
const secName=id=>(S.sections.find(s=>s.id===id)||{}).name||'-';
const joinLink=s=>location.origin+location.pathname+'?join='+s.id;
const curMode=()=>mode||(S.hosted.length?'teacher':S.mine.length?'student':null);

/* ---------- auth + live data ---------- */
function signIn(){
 msg='';const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
 auth.signInWithPopup(p).catch(e=>{msg=e.message;render()})
}
function logout(){auth.signOut()}
function unlisten(k){if(active[k]){active[k]();delete active[k]}delete D[k];delete loaded[k]}
function stop(){Object.keys(active).forEach(unlisten);Object.keys(D).forEach(k=>delete D[k]);loaded={};dying.clear()}
const BASE=['hosted','mine','mysubs'];
function listen(k,q){
 if(active[k])return;
 active[k]=q.onSnapshot(s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[k]=1;sync()},
  e=>{console.error(k,e);if(e.code==='permission-denied'&&!BASE.includes(k))return;msg='Database error ('+k+'): '+e.code;loaded[k]=1;render()})
}
function listenDoc(k,ref){
 if(active[k])return;
 active[k]=ref.onSnapshot(d=>{D[k]=d.exists?[{id:d.id,...d.data()}]:[];loaded[k]=1;sync()},
  e=>{console.error(k,e);if(e.code==='permission-denied')return;msg='Database error ('+k+'): '+e.code;render()})
}

function wire(){
 if(!authed)return;
 const want=new Set();
 S.hosted.forEach(s=>['mat','act','hsub','mem'].forEach(p=>want.add(p+':'+s.id)));
 S.mine.forEach(m=>['sec','mat','act'].forEach(p=>want.add(p+':'+m.section)));
 want.forEach(k=>{
  const i=k.indexOf(':'),p=k.slice(0,i),id=k.slice(i+1);
  if(p==='mat')listen(k,col('materials').where('section','==',id));
  else if(p==='act')listen(k,col('activities').where('section','==',id));
  else if(p==='hsub')listen(k,col('subs').where('section','==',id));
  else if(p==='mem')listen(k,col('members').where('section','==',id));
  else if(p==='sec')listenDoc(k,col('sections').doc(id));
 });
 Object.keys(active).filter(k=>k.includes(':')&&!want.has(k)).forEach(unlisten);
}
auth.onAuthStateChanged(u=>{
 stop();authed=u;mode=null;joinInfo=null;me=u?{id:u.uid,name:u.displayName||u.email||'Me',email:(u.email||'').toLowerCase()}:null;
 if(u){
  listen('hosted',col('sections').where('host','==',u.uid));
  listen('mine',col('members').where('student','==',u.uid));
  listen('mysubs',col('subs').where('student','==',u.uid));
  fetchJoin();
 }
 render();
});
function sync(){wire();soft()}
async function fetchJoin(){
 if(!authed||!joinCode)return;
 try{const d=await col('sections').doc(joinCode).get();joinInfo=d.exists?{id:d.id,...d.data()}:{bad:1}}
 catch(e){console.error(e);joinInfo={bad:1}}
 render();
}
function soft(){
 const a=document.activeElement;
 if(taking)return;
 if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.readOnly){pend=true;return}
 render();
}
document.addEventListener('focusout',()=>{if(pend){pend=false;setTimeout(()=>{if(!taking)render()},300)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

/* =====================================================================
   CONTENT ANALYSIS + QUIZ GENERATOR
   Pipeline: clean text -> find headings/sentences -> detect definitions
   -> weight key concepts -> pick the best "teachable" sentences ->
   build questions with smart distractors, styled by difficulty level.
   ===================================================================== */
const STOP=new Set(('a an the and or but if then else when while of at by for with about against between into through during before after above below to from up down in out on off over under again further once here there all any both each few more most other some such no nor not only own same so than too very can will just should now is are was were be been being have has had do does did this that these those it its they them their he she his her we our you your i me my also may might must shall would could which who whom whose what where why how as because since until although however therefore thus hence per via among within without upon one two three first second third many much called known using used make made often important different various include includes including example examples given based type types like well even still every another around usually generally sometimes ang ng sa na at ay mga ito para ni kay din rin ba po lang ko mo niya sila kami tayo kung kapag dahil pero ngunit pa review companion unit lesson chapter topic learning competency competencies target material materials day days objective objectives activity activities page contain contains produce produces occur occurs form forms replace replaces describe describes consist consists become becomes').split(' '));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isKey=w=>!STOP.has(w.toLowerCase())&&(w.length>=4||/^\p{Lu}{2,6}$/u.test(w));
function toks(s){
 const out=[],re=/\p{L}+(?:[-'’]\p{L}+)*/gu;let m,prev=-1;
 while((m=re.exec(s))){out.push({w:m[0].replace(/['’]s$/i,''),i:m.index,adj:prev>=0&&/^\s+$/.test(s.slice(prev,m.index))});prev=m.index+m[0].length}
 return out;
}

/* 1. Remove worksheet headers, page numbers, names/dates, repeated header/footer lines (only whole noise LINES are removed,
      so educational sentences that merely contain words like "class" or "subject" are kept). */
const NOISE_LABEL=/^(name|date|score|section|grade|teacher|instructor|professor|school|class|subject|course|student|directions?|instructions?|time allowed|total points?)\s*[:_\-–]/i;
const NOISE_ORG=/\b(university|college|school|academy|department|faculty|campus|institute)\b/i;
function isNoiseLine(l){
 if(/^[\d\W_]+$/.test(l))return true;
 if(/^(page\s*)?\d+(\s*(of|\/)\s*\d+)?$/i.test(l))return true;
 if(NOISE_LABEL.test(l))return true;
 if(/(https?:\/\/|www\.|@\w+\.\w+)/i.test(l))return true;
 if(/copyright|all rights reserved|©/i.test(l))return true;
 if(l.length<70&&NOISE_ORG.test(l)&&!/[.!?]$/.test(l))return true;
 if(/^(mon|tues?|wednes|thurs?|fri|satur|sun)day,?\s/i.test(l)||/^[A-Za-z]+ \d{1,2},? \d{4}$/.test(l))return true;
 return false;
}
/* Only titles / unit / competency labels are filtered out. Everything else that is lesson content is kept:
   full sentences, bullet points, equations, tables and ALL-CAPS slide lines. */
const NOISE_SENT=/\b(learning competenc\w*|target competenc\w*|competenc(?:y|ies)|LC\s?\d+|learning objectives?|unit\s*\d+|chapter\s*\d+|lesson\s*\d+|module\s*\d+|days?\s*\d+\s*[-–—]\s*\d+|week\s*\d+)\b/i;
const SYM=/[→←⇒=+|&\/]/;
const capsHeavy=s=>{const w=(s.match(/\p{L}+/gu)||[]).filter(x=>x.length>=3);return w.length>=2&&w.filter(x=>x===x.toUpperCase()).length/w.length>0.5};
const isFrag=s=>SYM.test(s)||capsHeavy(s);
function cleanLines(raw){
 const lines=String(raw||'').replace(/\r/g,'').replace(/[ \t]*[•●▪◦][ \t]*/g,'\n• ').split('\n').map(l=>l.replace(/\s+/g,' ').trim());
 const cnt={},key=l=>l.toLowerCase().replace(/\d+/g,'#');
 lines.forEach(l=>{if(l&&l.length<80)cnt[key(l)]=(cnt[key(l)]||0)+1});
 return lines.filter(l=>!l||(!(l.length<80&&cnt[key(l)]>=3)&&!isNoiseLine(l)));
}
function splitSentences(p){
 const t=p.replace(/\b(e\.g|i\.e|etc|vs|fig|dr|mr|mrs|ms|prof|no|approx|st)\./gi,m=>m.slice(0,-1)+'\u0001').replace(/(\d)\.(\d)/g,'$1\u0001$2');
 return t.split(/(?<=[.!?])\s+(?=[\p{Lu}\d"'(])/u).map(s=>s.replace(/\u0001/g,'.').trim()).filter(Boolean);
}

/* 2. Definition detection ("X is defined as...", "X refers to...", "X is a ...", "X: ...") */
const DEFRE=[
 /^(?:(?:an?|the)\s+)?([\p{L}][\p{L}\- ]{2,45}?)\s+(?:is|are)\s+(?:defined as|called|known as|referred to as|described as)\s+(.{12,})$/iu,
 /^(?:(?:an?|the)\s+)?([\p{L}][\p{L}\- ]{2,45}?)\s+(?:refers to|means|denotes)\s+(.{12,})$/iu,
 /^(?:(?:an?|the)\s+)?([\p{L}][\p{L}\- ]{2,45}?)\s+(?:is|are)\s+((?:an?|the|any|one of)\s.{12,})$/iu,
 /^([\p{L}][\p{L}\- ]{2,40}?)\s*[:–—]\s+(.{15,})$/u
];
const BADTERM=/^(it|this|that|these|those|they|he|she|there|we|you|which|what|who|example|note|remember|tip|question|answer|figure|table|step)\b/i;
function findDef(s){
 for(const re of DEFRE){
  const m=s.match(re);if(!m)continue;
  const term=m[1].trim().replace(/^(?:an?|the)\s+/i,''),def=m[2].trim().replace(/[.!]+$/,'');
  const ws=term.split(/\s+/);
  if(ws.length>4||BADTERM.test(term)||!ws.some(isKey)||/[,;()]/.test(term))continue;
  if(ws.some(w=>STOP.has(w.toLowerCase())&&w.toLowerCase()!=='of'))continue;
  if(def.split(/\s+/).length<4)continue;
  return {term,k:term.toLowerCase(),def};
 }
 return null;
}

/* 3. Analyze the whole lesson */
function analyze(raw){
 const lines=cleanLines(raw),sents=[],headK=new Set();let topic='',buf=[];
 /* the document's title block (first line) is not lesson content */
 const fi=lines.findIndex(l=>l);
 if(fi>=0){const t=lines[fi];if(t.split(' ').length>=3&&t.length<=150&&!/[.!?:]$/.test(t)&&!/^(•|●|▪|\*|-|–|\d+[.)])\s/.test(t)&&!isFrag(t))lines[fi]=''}
 const flush=()=>{if(buf.length)splitSentences(buf.join(' ')).forEach(s=>sents.push({s,topic}));buf=[]};
 const BUL=/^(•|●|▪|\*|-|–|\d+[.)])\s+/;
 lines.forEach(l=>{
  if(!l){flush();return}
  const bullet=BUL.test(l),b=l.replace(BUL,'');
  const wc=b.split(' ').length;
  /* equations, tables, ALL-CAPS slide lines: each line is its own piece of content */
  if(isFrag(b)){flush();sents.push({s:b,topic,frag:true});return}
  if(bullet&&wc>=3){flush();splitSentences(b).forEach(s=>sents.push({s,topic}));return}
  if(b.length<70&&!/[.!?:,;]$/.test(b)&&wc<=8&&!/\b(is|are|was|were)\b/i.test(b)){
   flush();topic=b;toks(b).forEach(t=>isKey(t.w)&&headK.add(t.w.toLowerCase()));return;
  }
  buf.push(b);
 });
 flush();
 const S2=sents.filter(x=>{
  const w=x.s.split(/\s+/).length;
  return w>=3&&w<=60&&x.s.length<=320&&(x.s.match(/\p{L}{2,}/gu)||[]).length>=2&&!/\?$/.test(x.s)&&!/^(figure|fig\.|table\s*\d|source:)/i.test(x.s)&&!NOISE_SENT.test(x.s);
 });
 const freq={},bi={},capMid={},lowMid={},acr={};
 S2.forEach(({s})=>{
  const t=toks(s);
  t.forEach((o,j)=>{
   if(!isKey(o.w))return;
   const l=o.w.toLowerCase();freq[l]=(freq[l]||0)+1;
   if(/^\p{Lu}{2,6}$/u.test(o.w)||/\p{Lu}/u.test(o.w.slice(1)))acr[l]=o.w;
   if(j>0){if(/^\p{Lu}/u.test(o.w)&&!/^\p{Lu}{2,}$/u.test(o.w))capMid[l]=(capMid[l]||0)+1;else lowMid[l]=(lowMid[l]||0)+1}
   if(j>0&&o.adj&&isKey(t[j-1].w)){const k=t[j-1].w.toLowerCase()+' '+l;bi[k]=(bi[k]||0)+1}
  });
 });
 const defs=[],seen=new Set();
 S2.forEach(x=>{x.def=findDef(x.s);if(x.def&&!seen.has(x.def.k)){seen.add(x.def.k);defs.push(x.def)}});
 const defK=new Set(defs.map(d=>d.k));
 const terms={};
 const add=(k,disp,w)=>{terms[k]=terms[k]?{...terms[k],w:Math.max(terms[k].w,w)}:{k,disp,w}};
 Object.keys(freq).forEach(l=>{
  const proper=capMid[l]&&!lowMid[l];
  add(l,acr[l]||(proper?cap(l):l),1+Math.log(freq[l])+(headK.has(l)?1.5:0)+(proper?.5:0)+(l.length>=8?.4:0)+(defK.has(l)?3:0));
 });
 Object.keys(bi).filter(k=>bi[k]>=2).forEach(k=>add(k,k,2.5+Math.log(bi[k])+(defK.has(k)?3:0)));
 defs.forEach(d=>add(d.k,/^\p{Lu}{2,6}$/u.test(d.term)?d.term:d.term.toLowerCase(),5));
 const termList=Object.values(terms);
 const cands=S2.map((x,idx)=>{
  const t=toks(x.s),ks=new Set();
  t.forEach((o,j)=>{
   if(!isKey(o.w))return;
   ks.add(o.w.toLowerCase());
   if(j>0&&o.adj&&isKey(t[j-1].w))ks.add(t[j-1].w.toLowerCase()+' '+o.w.toLowerCase());
  });
  if(x.def)ks.add(x.def.k);
  const hits=[...ks].map(k=>terms[k]).filter(Boolean).sort((a,b)=>b.w-a.w);
  let sc=hits.slice(0,3).reduce((a,h)=>a+h.w,0)+(x.def?4:0)+(/\d/.test(x.s)?.5:0)+(x.s.length>=60&&x.s.length<=200?1:0);
  /* sentences that depend on earlier context ("This is...", "However...") make bad standalone questions */
  if(!x.def&&/^(this|that|these|those|it|its|they|he|she|there|such|however|therefore|thus|also|but|and|so|then|their)\b/i.test(x.s))sc-=100;
  return {...x,idx,terms:hits,score:sc};
 }).filter(c=>c.terms.length&&c.score>0);
 const concepts=[...termList].sort((a,b)=>b.w-a.w).slice(0,8).map(t=>t.disp);
 const partOf=new Set();Object.keys(bi).filter(k=>bi[k]>=2).forEach(k=>{const [w1,w2]=k.split(' ');if(freq[w1]<=bi[k]+1)partOf.add(w1);if(freq[w2]<=bi[k]+1)partOf.add(w2)});
 const topicSet={};cands.forEach(c=>{(topicSet[c.topic]=topicSet[c.topic]||new Set());c.terms.forEach(t=>topicSet[c.topic].add(t.k))});
 return {cands,termList,defs,byK:terms,concepts,topicSet,partOf};
}

/* 4. Distractors. Beginner = clearly different from the answer (easy to rule out).
      Advanced = very close to the answer (same shape, similar length, same topic) so the learner must really know it. */
function distractors(T,sent,A,need,level,topic){
 const tl=T.k,low=sent.toLowerCase(),multi=tl.includes(' '),isAc=x=>/^\p{Lu}{2,6}$/u.test(x.disp),acr=isAc(T);
 const near=A.topicSet&&A.topicSet[topic];
 const pool=A.termList.filter(x=>(acr||!isAc(x))&&(x.k.length>=4||isAc(x))&&x.k!==tl&&!low.includes(x.k)&&x.k.slice(0,5)!==tl.slice(0,5)&&!tl.includes(x.k)&&!x.k.includes(tl)&&!(x.k.length>=5&&low.includes(x.k.slice(0,5)))&&!(A.partOf&&A.partOf.has(x.k)));
 const easy=level==='Beginner',hard=level==='Advanced';
 const score=x=>{
  const same=(x.k.includes(' ')===multi?2:0)+(isAc(x)===acr?1:0)-Math.abs(x.k.length-tl.length)/6;
  const topical=near&&near.has(x.k)?1.5:0;
  const imp=Math.min(x.w,4)/2;
  if(easy)return -same*0.8+imp*0.6+Math.random()*1.5;
  if(hard)return same*1.5+topical*1.5+imp+Math.random()*0.5;
  return same+topical*0.5+imp+Math.random();
 };
 return pool.sort((a,b)=>score(b)-score(a)).slice(0,need).map(x=>x.disp);
}
const sub=(s,t,r)=>{const o=s.replace(new RegExp('(^|[^\\p{L}])'+reEsc(t)+'(?:s|es)?(?![\\p{L}])','giu'),(m,p)=>p+r);return o!==s?o:null};
const blank=(s,t)=>sub(s,t,'_____');
const fmtDef=d=>cap(d.replace(/[.!]+$/,''));

/* meaning-reversing words: used to make subtle false statements */
const ANT=[['increase','decrease'],['increases','decreases'],['increased','decreased'],['higher','lower'],['more','less'],['greater','smaller'],['larger','smaller'],['faster','slower'],['before','after'],['above','below'],['always','never'],['positive','negative'],['gain','lose'],['gains','loses'],['absorb','release'],['absorbs','releases'],['absorbed','released'],['maximum','minimum'],['inside','outside'],['all','none']];
function antonym(s){
 for(const [a,b] of ANT)for(const [x,y] of [[a,b],[b,a]]){
  const re=new RegExp('\\b'+x+'\\b','i'),m=s.match(re);
  if(m)return s.replace(re,m[0][0]===m[0][0].toUpperCase()?cap(y):y);
 }
 return null;
}

/* 5. Build one question of a given type, written for the chosen difficulty level.
      Beginner     : recall / recognition. Main concepts, short sentences, 3 clearly different choices, obvious false statements.
      Intermediate : understanding. 4 related choices, definition matching both ways, fill-in-the-blank.
      Advanced     : analysis. Details and relationships, 4 very close choices, "which statement is correct" with subtly altered
                     statements, subtle false statements (reversed meaning, changed numbers, swapped secondary concept). */
function mk(c,type,lvl,A,st){
 const s=c.s,D=c.def,beg=lvl==='Beginner',adv=lvl==='Advanced';
 let T=c.terms[0];
 if(adv&&!D&&c.terms.length>1)T=[...c.terms.slice(0,3)].sort((a,b)=>(b.k.includes(' ')?1:0)-(a.k.includes(' ')?1:0)||b.k.length-a.k.length)[0];
 if(D)T=A.byK[D.k]||T;
 if(!T)return null;
 const occ=t=>(s.match(new RegExp('(^|[^\\p{L}])'+reEsc(t.k)+'(?:s|es)?(?![\\p{L}])','giu'))||[]).length;
 /* never blank a word that appears twice in the sentence (the other copy would give the answer away) */
 if(!D&&type!=='tf'&&occ(T)>1){const alt=c.terms.find(t=>occ(t)===1);if(!alt)return null;T=alt}
 const dis=(t,n)=>distractors(t,s,A,n,lvl,c.topic);
 const nch=beg?2:3;

 const fx={
  neg:()=>{
   if(/\b(not|no|never|cannot)\b|n't/i.test(s))return null;
   const r=s.replace(/\b(is|are|was|were|can|does|do|will|has|have)\b/i,m=>m.toLowerCase()==='can'?(m[0]==='C'?'Cannot':'cannot'):m+' not');
   return r!==s?r:null;
  },
  num:()=>{
   const m=s.match(/\b\d+(?:\.\d+)?\b/);if(!m)return null;
   const v=parseFloat(m[0]);let nv;
   if(Number.isInteger(v)&&v>=1000&&v<=2100)nv=v+(Math.random()<.5?-1:1)*(3+Math.floor(Math.random()*20));
   else if(v>=10)nv=Math.round(v*(Math.random()<.5?.5:2));
   else nv=v+1+Math.floor(Math.random()*3);
   return nv===v?null:s.replace(m[0],String(nv));
  },
  ant:()=>antonym(s),
  swap:()=>{if(!D&&s.toLowerCase().indexOf(T.k)>12)return null;const d=dis(T,1)[0];return d?sub(s,T.k,d):null},
  swap2:()=>{
   const T2=c.terms.find(t=>t.k!==T.k&&!T.k.includes(t.k)&&!t.k.includes(T.k));
   if(!T2)return null;
   const d=distractors(T2,s,A,1,lvl,c.topic)[0];
   return d?sub(s,T2.k,d):null;
  }
 };
 const falsify=order=>{for(const k of order){const r=fx[k]();if(r&&r!==s)return r}return null};

 if(type==='tf'){
  let stmt=s,ans='True';
  if(st.tf%2===1){
   const r=falsify(beg?['neg','ant','swap']:adv?['ant','num','swap2','swap','neg']:['swap','ant','num','neg']);
   if(r){stmt=r;ans='False'}
  }
  st.tf++;
  return {t:'tf',q:(adv?'Decide whether this statement is accurate: ':'True or False: ')+cap(stmt),a:ans,src:s,_k:T.k};
 }

 if(type==='mc'){
  /* Advanced: pick the one correct statement out of four near-identical ones */
  if(adv&&!c.frag&&s.length<=220&&st.adv++%2===0){
   const wrong=[],seen=new Set([s]);
   for(const k of ['ant','num','neg','swap2','swap']){
    const r=fx[k]();if(r&&!seen.has(r)){seen.add(r);wrong.push(r)}
    if(wrong.length>=3)break;
   }
   if(wrong.length<3){
    for(const d of dis(T,3)){
     if(wrong.length>=3)break;
     const r=sub(s,T.k,d);if(r&&!seen.has(r)){seen.add(r);wrong.push(r)}
    }
   }
   if(wrong.length>=3)return {t:'mc',q:'Which of the following statements is correct?',ch:shuf([s,...wrong.slice(0,3).map(cap)]),a:s,src:s,_k:T.k};
  }
  if(D){
   const od=A.defs.filter(x=>x.k!==D.k&&!x.def.toLowerCase().includes(T.k));
   const words=d=>d.toLowerCase().split(/\W+/).filter(Boolean);
   const dw=new Set(words(D.def));
   const sim=x=>{const b=words(x.def);return b.filter(w=>dw.has(w)).length/(b.length+1)};
   const lenD=x=>Math.abs(x.def.length-D.def.length);
   if(!beg&&od.length>=3&&(adv||st.mc++%2===0)){
    const pick=(adv?od.sort((a,b)=>sim(b)-sim(a)||lenD(a)-lenD(b)):od.sort((a,b)=>lenD(a)-lenD(b))).slice(0,6);
    const right=fmtDef(D.def),ds=shuf(pick).slice(0,3).map(x=>fmtDef(x.def));
    return {t:'mc',q:adv?`Which of the following most accurately describes ${T.disp}?`:`According to the lesson, which of the following best describes ${T.disp}?`,ch:shuf([right,...ds]),a:right,src:s,_k:T.k};
   }
   const ds=dis(T,nch);if(ds.length<nch)return null;
   const dq=blank(D.def,T.disp)||D.def;
   return {t:'mc',q:beg?`Which term means: “${dq}”?`:`Which term matches this description: “${dq}”?`,ch:shuf([cap(T.disp),...ds.map(cap)]),a:cap(T.disp),src:s,_k:T.k};
  }
  const b=blank(s,T.disp);if(!b)return null;
  const ds=dis(T,nch);if(ds.length<nch)return null;
  const lead=beg?'Fill in the blank: ':adv?'Choose the term that correctly completes the statement: ':'Choose the term that best completes the sentence: ';
  return {t:'mc',q:lead+b,ch:shuf([cap(T.disp),...ds.map(cap)]),a:cap(T.disp),src:s,_k:T.k};
 }

 /* identification */
 if(D){
  const dq=blank(D.def,T.disp)||D.def;
  return {t:'id',q:(beg?'What term means: ':adv?'Name the term that fits this description: ':'What term is described here: ')+`“${dq}”?`,a:T.disp,src:s,_k:T.k};
 }
 const b=blank(s,T.disp);if(!b)return null;
 return {t:'id',q:(adv?'Provide the missing term: ':'Fill in the blank: ')+b,a:T.disp,src:s,_k:T.k};
}

function generate(text,n,types,level){
 const lvl=LEVELS.includes(level)?level:'Intermediate',A=analyze(text);
 /* difficulty decides WHICH parts of the lesson are used */
 const rank=c=>c.score+(lvl==='Beginner'
  ?(c.def?3:0)+(c.s.length<130?2:c.s.length>180?-3:-1)+Math.min(c.terms[0].w,6)*0.3
  :lvl==='Advanced'
  ?(c.terms.length>=3?2:c.terms.length>=2?1:0)+(c.s.length>=100?2:-1.5)+(/\d/.test(c.s)?1.5:0)+(c.def?-1.5:0)
  :0);
 const st={tf:Math.floor(Math.random()*2),mc:0,adv:0},out=[],used=new Set(),topicN={};
 /* spread the questions over different concepts and different parts of the lesson */
 for(const strict of [true,false]){
  let pool=A.cands.filter(c=>!out.some(o=>o.idx===c.idx));
  while(out.length<n&&pool.length){
   let best=null,bs=-1e9;
   for(const c of pool){
    const k1=c.terms[0].k;
    if(strict&&used.has(k1))continue;
    const pen=(used.has(k1)?4:0)+(c.topic?2*(topicN[c.topic]||0):0)
     +c.terms.slice(0,3).filter(t=>used.has(t.k)).length*1.2+(out.some(o=>Math.abs(o.idx-c.idx)<=1)?2:0);
    const sc=rank(c)-pen;
    if(sc>bs){bs=sc;best=c}
   }
   if(!best)break;
   pool=pool.filter(c=>c!==best);
   for(let k=0;k<types.length;k++){
    const q=mk(best,types[(out.length+k)%types.length],lvl,A,st);
    if(q){
     out.push({q,idx:best.idx});used.add(q._k);
     best.terms.slice(0,2).forEach(t=>used.add(t.k));
     topicN[best.topic]=(topicN[best.topic]||0)+1;break;
    }
   }
  }
 }
 out.sort((a,b)=>a.idx-b.idx);
 const qs=out.map(o=>{const {_k,...q}=o.q;return q});
 let note='';
 if(!qs.length)note='Could not find enough lesson content to build questions. Make sure the lesson text is not only headings or a worksheet header.';
 else if(qs.length<n)note=`Only ${qs.length} good question(s) could be built from this lesson (you asked for ${n}). Add more lesson text for more.`;
 return {qs,note,concepts:A.concepts};
}

/* answers are compared ignoring case, punctuation, a leading "a/an/the" and a trailing plural "s" */
const norm=s=>{let t=String(s??'').toLowerCase().replace(/[“”"'’.,;:!?()]/g,'').replace(/^(a|an|the)\s+/,'').replace(/\s+/g,' ').trim();return t.length>3?t.replace(/s$/,''):t};
function grade(act,ans){let sc=0;act.qs.forEach((q,i)=>{if(norm(ans[i])===norm(q.a))sc++});return sc}

function fileKind(f){
 const e=((f.name||'').split('.').pop()||'').toLowerCase();
 if(e==='pdf')return 'pdf';
 if(e==='docx')return 'docx';
 if(['png','jpg','jpeg','gif','webp','bmp','svg'].includes(e)||(f.type||'').startsWith('image/'))return 'img';
 if(['txt','md','csv','html','htm','json'].includes(e)||(f.type||'').startsWith('text/'))return 'txt';
 return 'other';
}
function dataUrlToBlob(u){
 const i=u.indexOf(','),h=u.slice(0,i),mime=(h.match(/:(.*?)(;|$)/)||[])[1]||'application/octet-stream';
 const bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);
 for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);
 return new Blob([a],{type:mime});
}
function cleanHtml(h){
 const d=new DOMParser().parseFromString(h,'text/html');
 d.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n=>n.remove());
 d.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)}));
 return d.body.innerHTML;
}

async function viewFile(id){

 if(!m||!m.fileMeta||!m.fileMeta.dataUrl){alert('This file was too large to attach. Only its text was saved.');return}

 const f=m.fileMeta,k=fileKind(f),blob=dataUrlToBlob(f.dataUrl),url=URL.createObjectURL(blob);
 const ov=document.createElement('div');ov.id='viewer';ov._url=url;
 ov.onclick=e=>{if(e.target===ov)closeViewer()};

 document.body.appendChild(ov);
 const vb=document.getElementById('vbody');
 try{
  if(k==='pdf')vb.innerHTML=`<iframe src="${url}" title="${esc(f.name)}"></iframe>`;
  else if(k==='img')vb.innerHTML=`<img src="${url}" alt="${esc(f.name)}">`;
  else if(k==='docx'){const r=await mammoth.convertToHtml({arrayBuffer:await blob.arrayBuffer()});vb.innerHTML='<div class="doc">'+cleanHtml(r.value)+'</div>'}
  else if(k==='txt'){const pre=document.createElement('pre');pre.textContent=await blob.text();vb.innerHTML='';vb.appendChild(pre)}
  else vb.innerHTML='<div class="doc">This file type cannot be previewed here. Use the Download button.</div>';
 }catch(e){console.error(e);vb.innerHTML='<div class="doc">Could not preview this file. Use the Download button.</div>'}
}

function Tracking(){

   });

   content += `<table><tr><th>Student</th><th>Done</th><th>Average</th><th>Missed</th><th>Last submitted</th><th>Status</th></tr>

 } : null;

 if (d) content += trackDetail(d, now);

}
function trackDetail(d,now){

/* ---------- File reading: extracts text for the quiz generator AND keeps the file so it can be opened on the page ---------- */
const MAX_ATTACH=600*1024; /* Firestore documents are limited to ~1 MiB; base64 adds ~33% */
const setStat=t=>{const e=document.getElementById('fstat');if(e)e.textContent=t};
const readAs=(f,m)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r[m](f)});
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function ocr(src){
 if(!window.Tesseract)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js');
 return (await Tesseract.recognize(src,'eng')).data.text;
}
async function pdfToText(buf){
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,out=[];
 for(let p=1;p<=pdf.numPages;p++){
  const tc=await (await pdf.getPage(p)).getTextContent();
  let line='',y=null;
  tc.items.forEach(it=>{
   const yy=Math.round(it.transform[5]);
   if(y!==null&&Math.abs(yy-y)>2){out.push(line.trim());line=''}
   line+=it.str+' ';y=yy;
  });
  out.push(line.trim());out.push('');
 }
 return out.join('\n');
}
async function pdfOcr(buf){
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,out=[];
 for(let p=1;p<=Math.min(pdf.numPages,8);p++){
  setStat('Running OCR on page '+p+'...');
  const pg=await pdf.getPage(p),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');
  cv.width=vp.width;cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  out.push(await ocr(cv));
 }
 return out.join('\n\n');
}
function htmlToText(h){
 const d=new DOMParser().parseFromString(h,'text/html');
 d.querySelectorAll('script,style,nav,header,footer').forEach(n=>n.remove());
 return d.body.textContent||'';
}
async function readFile(inp){
 const f=inp.files[0];
 if(!f)return;
 const ext=(f.name.split('.').pop()||'').toLowerCase();
 if(!val('mt'))document.getElementById('mt').value=f.name.replace(/\.[^.]+$/,'');
 const meta={name:f.name,size:f.size,type:f.type||''};
 let text='',notes=[];
 uploadedFileMeta=null;fileBusy=true;
 try{
  setStat('Reading file...');
  if(ext==='pdf'){
   const buf=await readAs(f,'readAsArrayBuffer');
   text=await pdfToText(buf);
   if(text.replace(/\s/g,'').length<40){setStat('No text layer found, running OCR (first 8 pages)...');text=await pdfOcr(buf)}
  }else if(ext==='docx'){
   text=(await mammoth.extractRawText({arrayBuffer:await readAs(f,'readAsArrayBuffer')})).value;
  }else if(['txt','md','csv','html','htm','json'].includes(ext)||(f.type||'').startsWith('text/')){
   text=await readAs(f,'readAsText');
   if(ext==='html'||ext==='htm')text=htmlToText(text);
  }else if((f.type||'').startsWith('image/')){
   setStat('Reading text from the image (OCR)...');
   text=await ocr(f);
  }
  if(f.size<=MAX_ATTACH)meta.dataUrl=await readAs(f,'readAsDataURL');
  else notes.push('File is over '+Math.round(MAX_ATTACH/1024)+' KB, so only its text will be saved (it cannot be opened later).');
 }catch(e){
  console.error(e);
  notes.push('Could not fully read this file: '+(e.message||e));
 }
 text=text.trim();
 if(text){const mx=document.getElementById('mx');if(mx)mx.value=text}
 else notes.push('No readable text found. Paste the lesson text below so quizzes can be generated.');
 setStat((text?'Ready: extracted '+text.length+' characters. ':'')+notes.join(' '));
 uploadedFileMeta=meta;fileBusy=false;
}

function addMat(){
 if(fileBusy){alert('Still reading the file, please wait a moment.');return}
 const t=val('mt').trim(),x=val('mx').trim();
 if(!t || (!x && !uploadedFileMeta)){alert('Add a title and either lesson text or a file.');return}
 if(!val('ms')){alert('Create a section first.');return}

  const meta={...uploadedFileMeta};
  /* keep the whole document safely under Firestore's 1 MiB limit */
  if(new Blob([x]).size+(meta.dataUrl?meta.dataUrl.length:0)>900000){
   delete meta.dataUrl;
   alert('The file plus its text is too large to attach, so only the text was saved.');
  }
  payload.fileMeta = meta;
 }
 
 col('materials').add(payload).then(()=>{
  uploadedFileMeta = null;
  render();
 }).catch(fail);
}

<script>
/* LearnITAll add-on: math equations/functions, word problems, inline images.
   Add-on: paste in its own script tag after the main script. */

/* ---------- 1. Math reader: normalizer + safe evaluator (no eval) ---------- */
const MFN={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp};
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function normMath(s){
 return String(s||'').replace(/[−–—]/g,'-').replace(/[×·∙⋅]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi')
  .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'($1)/($2)').replace(/\\(cdot|times)/g,'*').replace(/\\(left|right)/g,'').replace(/[{}$]/g,m=>m==='$'?'':m==='{'?'(':')')
  .replace(/√\s*(\([^)]*\)|[\w.]+)/g,(m,a)=>'sqrt('+a.replace(/^\(|\)$/g,'')+')')
  .replace(new RegExp('['+SUP+']+','g'),m=>'^'+[...m].map(c=>SUP.indexOf(c)).join(''))
  .replace(/\*\*/g,'^').replace(/(\d),(?=\d{3}\b)/g,'$1');
}
function mTok(s){
 const T=[];
 (normMath(s).match(/\d+\.?\d*|\.\d+|[a-zA-Z]+|[-+*\/^()]/g)||[]).forEach(x=>{
  if(/^[a-zA-Z]+$/.test(x)&&x.length>1&&!MFN[x.toLowerCase()]&&x.toLowerCase()!=='pi')[...x].forEach(c=>T.push(c));else T.push(x);
 });
 return T;
}
const mVars=s=>[...new Set(mTok(s).filter(t=>/^[a-z]$/i.test(t)&&t.toLowerCase()!=='e').map(t=>t.toLowerCase()))];
function mEval(s,vars={}){
 const T=mTok(s);let p=0;
 const expr=()=>{let v=term();while(T[p]==='+'||T[p]==='-'){const o=T[p++],r=term();v=o==='+'?v+r:v-r}return v};
 const term=()=>{let v=unary();for(;;){const t=T[p];
  if(t==='*'||t==='/'){p++;const r=unary();v=t==='*'?v*r:v/r}
  else if(t!==undefined&&t!==')'&&t!=='+'&&t!=='-')v*=unary(); /* implicit: 2x, 3(x+1) */

function mathItems(sc,lvl){

 sc.funcs.forEach(f=>{
  const F=x=>mEval(f.body,{[f.v]:x});
  const poly=safe(()=>{const v=[0,1,2,3,4,5,6].map(F);
   return Math.abs(v[5]-5*v[4]+10*v[3]-10*v[2]+5*v[1]-v[0])<1e-6&&Math.abs(v[6]-5*v[5]+10*v[4]-10*v[3]+5*v[2]-v[1])<1e-6?1:null});
  for(let k=0;k<3;k++){const a=R(lo,hi),val=safe(()=>F(a));
   if(val!==null)out.push({q:`Given ${f.line}, find ${f.name}(${a}).`,s:`Given ${f.line}, ${f.name}(${a}) = `,val})}
  if(poly&&lvl==='Advanced'){const a=R(lo,hi),h=1e-3,val=safe(()=>(F(a+h)-F(a-h))/(2*h));

function exprDistractors(e){

 if(nm.length>=2){const x=nm[0],y=nm[nm.length-1];out.add(e.slice(0,x.index)+y[0]+e.slice(x.index+x[0].length,y.index)+x[0]+e.slice(y.index+y[0].length))}

  const F=it.fm||fmt,t=types[i%types.length],a=F(it.val),hint=Number.isInteger(+a)?'':a.includes('/')?' (fraction or decimal)':' (round to 3 decimals)';
  if(it.e&&t==='mc'&&Math.random()<.5){ /* "translate" question: pick the right expression */
   const ds=exprDistractors(it.e).slice(0,3);
   if(ds.length===3)return {t:'mc',q:it.q+' Which expression translates this problem?',ch:shuf([it.e,...ds]),a:it.e};
  }

   if(ds.length===3)return {t:'mc',q:it.q+hint,ch:shuf([a,...ds]),a};

}

/* replaces gen(): math lines -> math questions, everything else -> your existing text generator */
function gen(){

/* numeric answers: 4 = 4.0 = "x = 4" = 8/2 (tolerance 0.01); everything else uses your old comparison */

/* ---------- 4. Word equations (OMML) are skipped by mammoth, so read them from the .docx XML ---------- */
async function docxMath(file){

  switch(L(n)){

/* ---------- 6. Word-problem solver: translates a sentence into an expression and solves it ---------- */

 if((m=L.match(/(\d+)\/(\d+) of a job in (\d+) days?\.\s*how much (?:per day|in 1 day)/)))return R(`(${m[1]}/${m[2]}) ÷ ${m[3]}`,m[1]/m[2]/m[3]);

}

 <script>
/* LearnITAll add-on: level locking with 75% pass mark + activities under each lesson */
const PASS=0.75;
const passed=s=>!!s&&s.total>0&&s.score/s.total>=PASS;
const mySub=a=>S.subs.find(s=>s.act===a.id&&s.student===me.id);

/* a level is done when every activity of that level in that class is submitted AND passed (>= 75%) */
function levelDone(sec,lvl){

}
function lockedBy(sec,lvl){

}

function actCard(a){

 <div class="mu">${esc(secName(a.section))} &middot; ${a.qs.length} questions &middot; due ${a.due?new Date(a.due).toLocaleString():'no deadline'}</div>${st}</div>`;
}

function Lessons(){

/* LearnITAll add-on: smarter quiz generator (replaces generate())
   - spreads the questions over the WHOLE lesson (one question per part of the file)
   - never blanks the lesson's main topic word again and again, and never repeats an answer
   - remembers what it already asked, so pressing Generate again gives different questions
   - Beginner / Intermediate / Advanced use different source sentences AND different question styles */
const g2mem={};
const g2hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
const g2rx=t=>'(^|[^\\p{L}])'+reEsc(t.k)+'(?:s|es)?(?![\\p{L}])';
const g2occ=(s,t)=>(s.match(new RegExp(g2rx(t),'giu'))||[]).length;

/* what kind of sentence is it? */
function g2feat(c){
 const s=c.s;
 return {len:s.length,def:!!c.def,num:/\d/.test(s),multi:c.terms.length,
  cause:/\b(because|therefore|thus|as a result|results? in|resulting in|leads? to|led to|causes?|caused|due to|so that|consequently)\b/i.test(s),
  cmp:/\b(while|whereas|unlike|compared|rather than|differs?|different from|versus|than|both|either)\b/i.test(s)};
}
/* which sentences suit which level */
function g2lvl(f,lvl){
 if(lvl==='Beginner')return (f.def?3:0)+(f.len<=120?2:f.len>180?-3:0)+(f.cause?-1.5:0)+(f.cmp?-1:0);
 if(lvl==='Advanced')return (f.cause?2.5:0)+(f.cmp?2:0)+(f.len>=100?1.5:f.len<70?-3:0)+(f.num?1.5:0)+(f.multi>=3?1:0)+(f.def?-1:0);
 return (f.def?1.2:0)+(f.len>=70&&f.len<=170?1.5:0)+(f.cause?1.2:0)+(f.num?.5:0);
}
function g2prep(text){
 const A=analyze(text),cs=A.cands.slice().sort((a,b)=>a.idx-b.idx),df={};
 cs.forEach((c,i)=>{c.first=i===0||c.topic!==cs[i-1].topic;c.f=g2feat(c);new Set(c.terms.map(t=>t.k)).forEach(k=>{df[k]=(df[k]||0)+1})});

}

/* choose the word to blank: specific to this sentence, NOT the word that appears in every sentence */
function g2target(c,P,lvl,ban){
 const beg=lvl==='Beginner',adv=lvl==='Advanced',s=c.s,dd=c.def;
 const pool=[...(dd&&P.A.byK[dd.k]?[P.A.byK[dd.k]]:[]),...c.terms].slice(0,10);
 let best=null,bs=-1e9;
 pool.forEach(t=>{
  if(ban.has(t.k)||g2occ(s,t)!==1)return;
  const n=P.df[t.k]||1,r=n/P.nC;
  let v=Math.log((P.nC+1)/n)*(beg?.6:1)+Math.min(t.w,6)*.25+Math.random()*1.5;
  if(r>.35&&P.nC>=6)v-=3;
  if(t.k.includes(' '))v+=adv?1.2:beg?-.3:.4;
  if(t.disp!==t.disp.toLowerCase())v+=.8;
  if(/(tion|sion|ment|ity|ism|ness|ance|ence|ology|ics|ase|ide)$/.test(t.k))v+=.6;
  if(/(ly|ing|ed)$/.test(t.k))v-=1.2;
  if(t.k.length>=7)v+=.4;
  if(dd&&t.k===dd.k)v+=beg?3:adv?-1:1;
  if(P.seen.ans.has(t.k))v-=4;
  if(v>bs){bs=v;best=t}
 });
 return best;
}

/* build one question of a given STYLE ("kind") */
function g2q(c,kind,lvl,P,st,ban){
 const s=c.s,dd=c.def,beg=lvl==='Beginner',adv=lvl==='Advanced',A=P.A,nch=beg?2:3;
 const T=g2target(c,P,lvl,ban),dis=(t,n)=>distractors(t,s,A,n,lvl,c.topic);
 const TD=dd?(A.byK[dd.k]||{k:dd.k,disp:dd.term,w:5}):null,k0=(T||c.terms[0]).k;
 const fx={
  neg:()=>{if(/\b(not|no|never|cannot)\b|n't/i.test(s))return null;const r=s.replace(/\b(is|are|was|were|can|does|do|will|has|have)\b/i,m=>m.toLowerCase()==='can'?(m[0]==='C'?'Cannot':'cannot'):m+' not');return r!==s?r:null},
  num:()=>{const m=s.match(/\b\d+(?:\.\d+)?\b/);if(!m)return null;const v=parseFloat(m[0]);let nv;
   if(Number.isInteger(v)&&v>=1000&&v<=2100)nv=v+(Math.random()<.5?-1:1)*(3+Math.floor(Math.random()*20));
   else if(v>=10)nv=Math.round(v*(Math.random()<.5?.5:2));else nv=v+1+Math.floor(Math.random()*3);
   return nv===v?null:s.replace(m[0],String(nv))},
  ant:()=>antonym(s),
  swap:()=>{if(!T)return null;const d=dis(T,1)[0];return d?sub(s,T.k,d):null},
  swap2:()=>{const T2=c.terms.find(t=>!T||(t.k!==T.k&&!T.k.includes(t.k)&&!t.k.includes(T.k)));if(!T2)return null;const d=distractors(T2,s,A,1,lvl,c.topic)[0];return d?sub(s,T2.k,d):null}
 };
 const fal=o=>{for(const k of o){const r=fx[k]();if(r&&r!==s)return r}return null};
 const ordF=beg?['neg','ant','swap']:adv?['ant','num','swap2','swap','neg']:Math.random()<.5?['swap','ant','num','neg']:['ant','swap','num','neg'];
 const uniq=(arr,bad)=>arr.filter((x,i,a)=>x.toLowerCase()!==bad.toLowerCase()&&a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i);

 const B={
  /* fill in the blank, choices */
  blankMC:()=>{if(!T)return null;const b=blank(s,T.disp);if(!b)return null;const ds=dis(T,nch);if(ds.length<nch)return null;
   return {t:'mc',q:(beg?'Fill in the blank: ':adv?'Choose the term that correctly completes the statement: ':'Choose the term that best completes the sentence: ')+b,ch:shuf([cap(T.disp),...ds.map(cap)]),a:cap(T.disp),src:s,_k:T.k}},
  /* fill in the blank, typed */
  blankID:()=>{if(!T)return null;const b=blank(s,T.disp);return b?{t:'id',q:(adv?'Provide the missing term: ':'Fill in the blank: ')+b,a:T.disp,src:s,_k:T.k}:null},
  /* definition -> term */
  defMC:()=>{if(!TD)return null;const dq=blank(dd.def,TD.disp)||dd.def;
   const od=shuf(A.defs.filter(x=>x.k!==dd.k).map(x=>(A.byK[x.k]||{disp:x.term}).disp)),g=dis(TD,nch);
   const ds=uniq(adv?[...g,...od]:[...od,...g],TD.disp).slice(0,nch);if(ds.length<nch)return null;
   return {t:'mc',q:beg?`Which term means: “${dq}”?`:`Which term matches this description: “${dq}”?`,ch:shuf([cap(TD.disp),...ds.map(cap)]),a:cap(TD.disp),src:s,_k:dd.k}},
  defID:()=>{if(!TD)return null;const dq=blank(dd.def,TD.disp)||dd.def;
   return {t:'id',q:(beg?'What term means: ':adv?'Name the term that fits this description: ':'What term is described here: ')+`“${dq}”?`,a:TD.disp,src:s,_k:dd.k}},
  /* term -> best description */
  termDef:()=>{if(!dd||beg)return null;const od=A.defs.filter(x=>x.k!==dd.k&&!x.def.toLowerCase().includes(dd.k));if(od.length<3)return null;
   const words=d=>d.toLowerCase().split(/\W+/).filter(Boolean),dw=new Set(words(dd.def));
   const sim=x=>{const b=words(x.def);return b.filter(w=>dw.has(w)).length/(b.length+1)},lenD=x=>Math.abs(x.def.length-dd.def.length);
   const pick=adv?od.slice().sort((a,b)=>sim(b)-sim(a)||lenD(a)-lenD(b)).slice(0,6):od;
   const right=fmtDef(dd.def),ds=shuf(pick).slice(0,3).map(x=>fmtDef(x.def)),name=TD.disp;
   return {t:'mc',q:adv?`Which of the following most accurately describes ${name}?`:`According to the lesson, which of the following best describes ${name}?`,ch:shuf([right,...ds]),a:right,src:s,_k:dd.k}},
  /* pick the one correct statement */
  which:()=>{if(c.frag||s.length>220)return null;const wrong=[],seen=new Set([s]);
   for(const k of adv?['ant','num','neg','swap2','swap']:['swap','ant','num','swap2']){const r=fx[k]();if(r&&!seen.has(r)){seen.add(r);wrong.push(r)}if(wrong.length>=3)break}
   if(wrong.length<3&&T)for(const d of dis(T,3)){if(wrong.length>=3)break;const r=sub(s,T.k,d);if(r&&!seen.has(r)){seen.add(r);wrong.push(r)}}
   if(wrong.length<3)return null;
   return {t:'mc',q:'Which of the following statements is correct?',ch:shuf([s,...wrong.slice(0,3)].map(cap)),a:cap(s),src:s,_k:k0}},
  /* three true statements from the lesson + one altered: pick the wrong one */
  notTrue:()=>{if(c.frag||s.length>200)return null;const bad=fal(['ant','num','swap2','swap','neg']);if(!bad)return null;
   const oth=P.cs.filter(o=>o!==c&&!o.frag&&o.s.length<=200&&o.s!==s);
   const tr=[...shuf(oth.filter(o=>o.topic===c.topic)),...shuf(oth.filter(o=>o.topic!==c.topic))].slice(0,3).map(o=>o.s);
   if(tr.length<3)return null;
   return {t:'mc',q:'Which of the following statements is NOT correct?',ch:shuf([bad,...tr].map(cap)),a:cap(bad),src:s,_k:k0}},
  /* two blanks: the student must know both terms and their order */
  pair:()=>{if(!T||c.frag)return null;
   const T2=c.terms.find(t=>t.k!==T.k&&!T.k.includes(t.k)&&!t.k.includes(T.k)&&g2occ(s,t)===1&&(P.df[t.k]||1)/P.nC<=.4);if(!T2)return null;
   const b0=blank(s,T.disp),b=b0&&blank(b0,T2.disp);if(!b)return null;
   const mm=b.match(/_____([^_]*)_____/);if(mm&&/^[\s,;&]*(and|or)?[\s,;&]*$/i.test(mm[1]))return null;
   const first=s.search(new RegExp(g2rx(T),'iu'))<=s.search(new RegExp(g2rx(T2),'iu')),x=first?T:T2,y=first?T2:T;
   const dx=dis(x,1)[0],dy=dis(y,1)[0];if(!dx||!dy)return null;
   const right=cap(x.disp)+' / '+y.disp,ch=uniq([right,cap(y.disp)+' / '+x.disp,cap(dx)+' / '+y.disp,cap(x.disp)+' / '+dy],'');
   if(ch.length<4)return null;
   return {t:'mc',q:'Which pair of terms correctly completes the statement (in order)? '+b,ch:shuf(ch),a:right,src:s,_k:T.k}},
  tf:()=>{let stmt=s,ans='True';if(st.tf%2===1){const r=fal(ordF);if(r){stmt=r;ans='False'}}st.tf++;
   return {t:'tf',q:(adv?'Decide whether this statement is accurate: ':'True or False: ')+cap(stmt),a:ans,src:s,_k:k0}}
 };
 return B[kind]?B[kind]():null;
}

/* which styles each level uses */
const g2K={
 Beginner:{mc:['defMC','blankMC'],tf:['tf'],id:['defID','blankID']},
 Intermediate:{mc:['termDef','defMC','blankMC','which'],tf:['tf'],id:['defID','blankID']},
 Advanced:{mc:['notTrue','which','pair','termDef','blankMC'],tf:['tf'],id:['defID','blankID']}
};

function generate(text,n,types,level){
 const lvl=LEVELS.includes(level)?level:'Intermediate',P=g2prep(text),cs=P.cs;
 if(!cs.length)return {qs:[],note:'Could not find enough lesson content to build questions. Make sure the lesson text is not only headings or a worksheet header.',concepts:P.A.concepts};
 /* memory: sentences and answers already used for this lesson text, plus answers of activities that already exist */
 const M=g2mem[g2hash(text)]||(g2mem[g2hash(text)]={sent:new Set(),ans:new Set()});
 if(M.sent.size>=cs.length*.7){M.sent.clear();M.ans.clear()}
 const old=new Set();
 S.activities.forEach(a=>(a.qs||[]).forEach(q=>{if(q&&q.t!=='tf'&&q.a)old.add(String(q.a).toLowerCase().trim())}));
 P.seen={sent:M.sent,ans:new Set([...M.ans,...old])};
 const slots=Array.from({length:n},(_,i)=>types[i%types.length]),tp=types.length>1?shuf(slots):slots;
 const out=[],usedS=new Set(),ban=new Set(),usedA=new Set(),usedQ=new Set(),st={tf:Math.floor(Math.random()*2),k:{}};
 const sc=c=>c.score*.3+g2lvl(c.f,lvl)+(lvl==='Beginner'&&c.first&&c.topic?1.5:0)-(M.sent.has(c.s)?50:0)+Math.random()*3;
 const tryC=(c,type)=>{
  const ks=(g2K[lvl][type]||[]).map(k=>[k,(st.k[k]||0)+Math.random()*1.2-(c.def&&/^(def|termDef)/.test(k)?1.5:0)]).sort((a,b)=>a[1]-b[1]);
  for(const [k] of ks){
   const q=g2q(c,k,lvl,P,st,ban);
   if(!q||usedQ.has(q.q)||(q.t!=='tf'&&usedA.has(norm(q.a))))continue;
   st.k[k]=(st.k[k]||0)+1;usedQ.add(q.q);if(q.t!=='tf')usedA.add(norm(q.a));
   return q;
  }
  return null;
 };
 const take=(c)=>{const q=tryC(c,tp[out.length]||tp[0]);if(q){out.push({q,idx:c.idx});usedS.add(c);ban.add(q._k)}return q};
 /* pass 1: cut the lesson into as many parts as questions and take the best sentence of each part */
 const m=Math.min(n,cs.length);
 for(let i=0;i<m;i++){
  const seg=cs.slice(Math.floor(i*cs.length/m),Math.floor((i+1)*cs.length/m)).filter(c=>!usedS.has(c)).map(c=>[c,sc(c)]).sort((a,b)=>b[1]-a[1]);
  for(const [c] of seg)if(take(c))break;
 }
 /* pass 2: fill any gaps from anywhere in the lesson */
 if(out.length<n){
  ban.clear();
  for(const [c] of cs.filter(c=>!usedS.has(c)).map(c=>[c,sc(c)]).sort((a,b)=>b[1]-a[1])){if(out.length>=n)break;take(c)}
 }
 out.sort((a,b)=>a.idx-b.idx);
 out.forEach(o=>{M.sent.add(o.q.src);if(o.q.t!=='tf')M.ans.add(String(o.q._k))});
 const qs=out.map(o=>{const {_k,...q}=o.q;return q});
 let note='';
 if(!qs.length)note='Could not find enough lesson content to build questions. Make sure the lesson text is not only headings or a worksheet header.';
 else if(qs.length<n)note=`Only ${qs.length} good question(s) could be built from this lesson (you asked for ${n}). Add more lesson text for more.`;
 return {qs,note,concepts:P.A.concepts};
}
</script><script>
/* LearnITAll add-on:
   1. Teachers upload their own activity sheets (file or link) for students
   2. After a quiz, the student sees which items were incorrect (review)
   3. Failed (< 75%) -> the retake is a NEW set of different questions
   Paste in its own <script> tag right before </body>, AFTER all other add-ons.
   (Delete the old "downloadable activity sheets" add-on if you already pasted it.) */

/* ================= 1. ACTIVITY SHEETS UPLOADED BY THE TEACHER ================= */
/* Sheets are saved in the existing "materials" collection with sheet:true, so no new Firestore rules are needed.
   They are hidden from the normal lesson lists and shown in their own cards. */
let shAll=false,shFile=null,shBusy=false;
Object.defineProperty(S,'materials',{configurable:true,get(){const a=flat('mat:');return shAll?a:a.filter(m=>!m.sheet)}});
Object.defineProperty(S,'sheets',{configurable:true,get(){return flat('mat:').filter(m=>m.sheet)}});

/* the file viewer looks files up in S.materials, so let it see sheets too */
const _shView=window.viewFile;
window.viewFile=function(id){shAll=true;try{return _shView(id)}finally{shAll=false}};

async function shRead(inp){
 const f=inp.files[0],st=document.getElementById('shstat');
 shFile=null;if(!f)return;
 if(f.size>MAX_ATTACH){
  if(st)st.textContent='This file is '+Math.round(f.size/1024)+' KB. The limit is '+Math.round(MAX_ATTACH/1024)+' KB. Compress it, or upload it to Google Drive and paste the link below.';
  inp.value='';return;
 }
 shBusy=true;if(st)st.textContent='Reading file...';
 try{
  shFile={name:f.name,size:f.size,type:f.type||'',dataUrl:await readAs(f,'readAsDataURL')};
  const t=document.getElementById('shT');if(t&&!t.value.trim())t.value=f.name.replace(/\.[^.]+$/,'');
  if(st)st.textContent='Attached: '+f.name;
 }catch(e){console.error(e);shFile=null;if(st)st.textContent='Could not read this file.'}
 shBusy=false;
}
function shAdd(){
 if(shBusy){alert('Still reading the file, please wait a moment.');return}
 const t=val('shT').trim(),link=val('shU').trim(),note=val('shN').trim();
 if(!t){alert('Add a title for the sheet.');return}
 if(!val('shS')){alert('Create a section first.');return}
 if(!shFile&&!link){alert('Attach a file or paste a link to the sheet.');return}
 if(link&&!/^https?:\/\//i.test(link)){alert('The link must start with http:// or https://');return}
 const p={title:t,level:val('shL'),section:val('shS'),text:note,sheet:true};
 if(link)p.link=link;
 if(shFile)p.fileMeta=shFile;
 col('materials').add(p).then(()=>{shFile=null;render()}).catch(fail);
}
function shCard(){
 const V=scoped(),ids=V.sections.map(s=>s.id),mine=S.sheets.filter(m=>ids.includes(m.section));
 return `<div class="card"><h2>Upload activity sheet</h2>
 <p class="mu">Upload your own activity sheet (PDF, Word, image...) or paste a link. Students in the section you choose can open or download it from their Lessons tab.</p>
 <label>Title</label><input id="shT">
 <div class="row"><div><label>Level</label><select id="shL">${LEVELS.map(l=>`<option>${l}</option>`).join('')}</select></div>
 <div><label>Section</label><select id="shS">${V.sections.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div>
 <label>Sheet file (PDF, DOCX, image, etc.)</label>
 <input type="file" id="shF" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,image/*" onchange="shRead(this)">
 <div class="mu" id="shstat" style="margin-top:4px">${shFile?'Attached: '+esc(shFile.name):''}</div>
 <label>Or link to the sheet (Google Drive, etc. Anyone with the link must be able to view it)</label><input id="shU">
 <label>Instructions for students (optional)</label><textarea id="shN" style="min-height:70px"></textarea>
 <button class="btn" onclick="shAdd()">Upload sheet</button></div>
 <div class="card"><h2>Uploaded activity sheets</h2>${mine.map(m=>`<div class="q" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
 <div style="flex:1;min-width:200px"><span class="tag">${esc(m.level)}</span><b>${esc(m.title)}</b> <span class="mu">&middot; ${esc(secName(m.section))}</span>
 ${m.text?`<div class="mu" style="white-space:pre-wrap">${esc(m.text)}</div>`:''}${fileBar(m)}
 ${m.link&&/^https?:\/\//i.test(m.link)?`<div style="margin-top:6px"><a href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">${esc(m.link)}</a></div>`:''}</div>
 <button class="btn d" style="margin:0" onclick="if(confirm('Delete this sheet?'))delMat('${m.id}')">Delete</button></div>`).join('')||'<p class="mu">None yet.</p>'}</div>`;
}
const _shMat=window.Materials;
window.Materials=function(){return _shMat()+shCard()};

/* student: sheets appear under Lessons (same level locking as lessons) */
function shStudent(){
 const ids=S.mine.map(m=>m.section),sh=S.sheets.filter(m=>ids.includes(m.section));
 if(!sh.length)return '';
 return `<div class="card"><h2>Activity sheets</h2><p class="mu">Sheets from your teacher. Open or download them and follow the instructions.</p>
 ${LEVELS.map(l=>sh.filter(m=>m.level===l).map(m=>{
  const lk=lockedBy(m.section,l);
  if(lk)return `<div class="q" style="opacity:.7">&#128274; <span class="tag">${l}</span><b>${esc(m.title)}</b> <span class="mu">&middot; ${esc(secName(m.section))}</span><div class="mu">Locked. Pass all ${lk} activities (75%+) in this class to unlock.</div></div>`;
  return `<div class="q"><span class="tag">${l}</span><b>${esc(m.title)}</b> <span class="mu">&middot; ${esc(secName(m.section))}</span>
  ${m.text?`<p style="white-space:pre-wrap">${esc(m.text)}</p>`:''}${fileBar(m)}
  ${m.link&&/^https?:\/\//i.test(m.link)?`<div style="margin-top:8px"><a class="btn s" style="margin:0" href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">Open link</a></div>`:''}</div>`;
 }).join('')).join('')}</div>`;
}
const _shLessons=window.Lessons;
window.Lessons=function(){return _shLessons()+shStudent()};

/* ================= 2. REVIEW + 3. NEW QUESTION SET ON RETAKE ================= */
let rvQs=null,rvSeen=null,rvData=null;

/* same marking rules as grade(): case/punctuation ignored, numbers compared with 0.01 tolerance */
const rvNum=s=>{s=String(s??'').replace(/^\s*[a-z]\s*=\s*/i,'').replace(/,/g,'').trim();return /^[\d\s.()+\-*\/^]+$/.test(s)?safe(()=>mEval(s)):null};
const rvRight=(q,a)=>{const x=rvNum(a),y=rvNum(q.a);return x!==null&&y!==null?Math.abs(x-y)<=0.01:norm(a)===norm(q.a)};
const rvWords=s=>(String(s||'').toLowerCase().match(/\p{L}{4,}|\d+/gu)||[]).filter(w=>!STOP.has(w));

/* the lesson the quiz came from (linked lesson, or any lesson of the same class and level) */
function rtSource(a){
 let m=a.mat?S.materials.find(x=>x.id===a.mat):null;
 if(!m||!(m.text||'').trim())m=S.materials.find(x=>x.section===a.section&&x.level===a.level&&(x.text||'').trim());
 return m||null;
}
/* build a new set of questions that does not repeat anything the student already saw */
function rtFresh(a,seen){
 const m=rtSource(a);if(!m)return null;
 const text=(m.text||'').trim();if(!text)return null;
 const n=a.qs.length||5,types=[...new Set(a.qs.map(q=>q.t))].filter(t=>['mc','tf','id'].includes(t));
 if(!types.length)types.push('mc');
 const lvl=a.level,seenQ=new Set(seen.map(q=>q.q)),seenW=seen.map(q=>new Set(rvWords([q.q,q.a].join(' '))));
 /* "old" = same question text, or built from (almost) the same lesson sentence as a question the student already had */
 const old=q=>{
  if(seenQ.has(q.q))return true;
  if(!q.src)return false;
  const w=rvWords(q.src);
  return w.length>=3&&seenW.some(S2=>w.filter(x=>S2.has(x)).length/w.length>=.6);
 };
 const sc=scanMath(text),tx=text.split('\n').filter(l=>!sc.lines.has(l.trim())).join('\n');
 const mq=mathQuestions(sc,n*2,types,lvl).filter(q=>!old(q));
 const tq=generate(tx,n*3,types,lvl).qs.filter(q=>!old(q));
 const mAlloc=Math.min(mq.length,Math.ceil(n/2));
 let out=[...tq.slice(0,n-mAlloc),...mq.slice(0,mAlloc)];
 for(const q of [...tq,...mq]){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
 const dup=new Set();
 out=out.filter(q=>!dup.has(q.q)&&dup.add(q.q));
 if(out.length<Math.max(1,Math.ceil(n/2)))return null;
 return JSON.parse(JSON.stringify(out.map(({src,_k,...q})=>q)));
}

/* start: first try = the teacher's quiz; after a failed try = a brand new set */
window.startAct=function(id){
 const a=S.activities.find(x=>x.id===id);
 if(!a||lockedBy(a.section,a.level)){msg='Finish the previous level first (75% or higher on every activity).';render();return}
 const sub=mySub(a);
 if(passed(sub)){msg='You already passed this activity.';render();return}
 if(!sub&&a.due&&new Date(a.due)<new Date()){msg='The deadline for this activity has passed.';render();return}
 rvData=null;rvQs=null;rvSeen=null;
 if(a.kind!=='pt'){
  if(sub){
   const seen=[...(sub.seen||[]),...(sub.qs||a.qs)],f=rtFresh(a,seen);
   if(!f){msg='A new set of questions could not be made from this lesson (it may be short or removed). Please ask your teacher for help.';render();return}
   rvQs=f;rvSeen=seen;
  }else rvQs=a.qs;
 }
 msg='';taking=id;render();
};

/* quiz page (uses the question set chosen above) */
const _rvTake=window.takeView;
window.takeView=function(){
 const a=S.activities.find(x=>x.id===taking);
 if(!a||a.kind==='pt')return _rvTake();
 const qs=rvQs||a.qs,sub=mySub(a);
 return `<div class="card"><h2>${esc(a.title)}</h2>
 ${rvSeen?`<div class="mu">Attempt ${((sub&&sub.attempt)||1)+1} &middot; this is a new set of questions</div>`:''}
 ${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>
 ${q.t==='mc'?q.ch.map(c=>`<label class="opt"><input type="radio" name="q${i}" value="${esc(c)}">${esc(c)}</label>`).join('')
 :q.t==='tf'?['True','False'].map(c=>`<label class="opt"><input type="radio" name="q${i}" value="${c}">${c}</label>`).join('')
 :`<input name="q${i}" placeholder="Your answer">`}</div>`).join('')}
 <button class="btn" onclick="submitAct()">Submit</button> <button class="btn s" onclick="taking=null;rvQs=null;rvSeen=null;render()">Cancel</button></div>`;
};

/* submit: grade against the set the student actually got, then show the review */
const _rvSubmit=window.submitAct;
window.submitAct=function(){
 const a=S.activities.find(x=>x.id===taking);
 if(!a||a.kind==='pt')return _rvSubmit();
 if(passed(mySub(a))){taking=null;render();return}
 const qs=rvQs||a.qs,prev=mySub(a);
 const ans=qs.map((q,i)=>{
  if(q.t==='id'){const e=document.querySelector(`[name=q${i}]`);return e?e.value:''}
  const c=document.querySelector(`[name=q${i}]:checked`);return c?c.value:'';});
 const score=qs.filter((q,i)=>rvRight(q,ans[i])).length;
 const doc={act:a.id,section:a.section,student:me.id,answers:ans,score,total:qs.length,at:Date.now()};
 if(rvSeen){doc.qs=qs;doc.seen=rvSeen;doc.attempt=((prev&&prev.attempt)||1)+1} /* retake sets are saved so the review matches */
 col('subs').doc(a.id+'_'+me.id).set(doc).catch(fail);
 rvData={a,qs,ans,score,total:qs.length};

<script>
/* =====================================================================
   LearnITAll add-on v3: cleaner lesson filtering, questions that make sense, smarter retake
   - only real teaching sentences are used (titles, headings, objectives, worksheet lines, instructions are dropped)
   - blanks are only made where the rest of the sentence still identifies the answer
   - wrong choices are same-kind terms from the lesson and are checked so they cannot also be correct
   - false statements are only made with safe edits (negation, opposite word, changed number, swapped term)
   - retake builds a NEW set (different sentences, then different answers), and never fails to start

   ===================================================================== */

const QG_WEAK=new Set('thing things something example examples result results number numbers part parts way ways kind kinds type types amount level levels place time times people person group groups area areas order case cases point points form forms work works great large small several certain common general special major main basic simple usually important different similar possible able easy using name names word words idea ideas fact facts'.split(' '));
const QG_META=/\b(?:learning (?:competenc|objective|outcome)\w*|objectives?\s*:|competenc(?:y|ies)\s*:|worksheet|activity sheet|answer key|quiz\b|bibliography|prepared by|table of contents|let us|let's|you will|you are going|students? will|learners? will|at the end of (?:the|this)|by the end of (?:the|this)|after (?:this|the) (?:lesson|module|unit)|in this (?:lesson|module|unit|chapter|topic|activity)|this (?:lesson|module|unit|chapter)|today we|refer to (?:the|page|figure|table|your)|see (?:page|figure|table)|as (?:shown|mentioned|discussed|stated|seen) (?:above|below|earlier|in)|(?:mentioned|discussed|shown) (?:above|earlier|below)|previous lesson|figure\s*\d|table\s*\d|the following|next page|discuss with|your teacher|your classmates|pre-?test|post-?test|warm-?up|copyright)/i;
const QG_IMP=/^(?:study|read|fill|choose|write|complete|copy|answer|discuss|look|observe|identify|match|circle|underline|draw|solve|list|name|give|explain|describe|define|tell|think|remember|note|try)\b/i;
const QG_DANGLE=/^(?:this|that|these|those|it|its|they|them|he|she|there|such|but|and|so|their|another|other|which|who|whose|both|either|neither|because|however|therefore|thus|also|moreover|furthermore|in addition|for example|for instance|as a result|similarly|likewise|meanwhile|finally|hence|consequently|additionally|overall|in conclusion|in summary|then)\b|^(?:first|second|third|next|lastly)\s*,/i;
const QG_VERB=/\b(?:is|are|was|were|be|been|being|has|have|had|can|could|may|might|must|will|would|should|does|do|did|ay|means|refers?|consists?|contains?|includes?|occurs?|forms?|produces?|uses?|helps?|allows?|causes?|results?|makes?|requires?|provides?|involves?|depends?|determines?|represents?|describes?|shows?|gives?|takes?|moves?|changes?|converts?|transfers?|controls?|stores?|connects?|measures?|called|known|used|made|found|formed|caused|produced|needed|based)\b|\b\p{L}{3,}(?:ed|ing|ize|ise|ify|ates?)\b/iu;
const QG_PRON=/^(?:it|this|that|these|those|they|he|she|there|we|you|which|what|who|example|note|figure|table|step)\b/i;
const QG_ANT=[['increase','decrease'],['increases','decreases'],['increased','decreased'],['increasing','decreasing'],['higher','lower'],['more','less'],['greater','smaller'],['larger','smaller'],['faster','slower'],['before','after'],['above','below'],['always','never'],['positive','negative'],['gain','lose'],['gains','loses'],['absorb','release'],['absorbs','releases'],['absorbed','released'],['maximum','minimum'],['inside','outside'],['rises','falls'],['expands','contracts'],['heavier','lighter'],['stronger','weaker'],['longer','shorter'],['warmer','cooler'],['conductor','insulator'],['conductors','insulators'],['input','output'],['same','different'],['open','closed'],['hot','cold']];
const QG_K={
 Beginner:{mc:['defMC','blankMC'],tf:['tf'],id:['defID','blankID']},
 Intermediate:{mc:['termDef','defMC','blankMC','which'],tf:['tf'],id:['defID','blankID']},
 Advanced:{mc:['which','notTrue','termDef','blankMC'],tf:['tf'],id:['defID','blankID']}
};

const qgAcr=w=>/^\p{Lu}{2,6}$/u.test(w);
const qgNorm=s=>' '+String(s).toLowerCase().replace(/[^\p{L}\d' -]+/gu,' ').replace(/\s+/g,' ').trim()+' ';
const qgW=s=>(String(s||'').toLowerCase().match(/\p{L}{4,}|\d+/gu)||[]).filter(w=>!STOP.has(w));
const qgAdj=/(?:ful|ous|ive|able|ible|less|ish|ical|ary)$/;
function qgKey(w){
 const l=w.toLowerCase();
 if(qgAcr(w))return !STOP.has(l);
 return w.length>=5&&!STOP.has(l)&&!QG_WEAK.has(l)&&!/ly$/.test(l);
}
function qgKind(t){
 const last=t.k.split(' ').pop();
 return (t.k.includes(' ')?'m':'s')+(qgAcr(t.d)?'a':'')+(t.proper?'p':'')+(/(?:ing|ed)$/.test(last)?'v':'')+(qgAdj.test(last)?'j':'')+(/[^su]s$/.test(last)&&!/(?:ics|ness)$/.test(last)?'n':'');

function qgOcc(s,k){return (s.match(new RegExp('(^|[^\\p{L}])'+reEsc(k)+'(?:s|es)?(?![\\p{L}])','giu'))||[]).length}

/* ---------- 1. FILTER: lesson text -> clean teaching sentences ---------- */
function qgHeading(b,prevEnd){
 const wc=b.split(' ').length;
 if(/[.!?]$/.test(b)||wc>10||!prevEnd)return false;
 if(capsHeavy(b)||/^(?:unit|lesson|module|chapter|week|day|topic|part|section|activity|quiz|exercise|review|summary|references?|objectives?)\b/i.test(b))return true;

function qgItems(raw){

  if(bul&&!m&&!prevEnd&&!capsHeavy(b)){bul.push(b);prevEnd=/[.!?]["”)]?$/.test(b);return}
  if(/:$/.test(b)){flush();if(wc<=8)topic=b.replace(/:$/,'');prevEnd=true;return}
  if(!m&&qgHeading(b,prevEnd)){flush();topic=b;prevEnd=true;return}
  if(m){flush();bul=[b];prevEnd=/[.!?]["”)]?$/.test(b);return}
  buf.push(b);prevEnd=/[.!?]["”)]?$/.test(b);
 });

}
function qgSentOK(s,bul){

 if(bul&&!/[.!]["”)]?$/.test(s)&&(STOP.has((s.match(/(\p{L}+)\W*$/u)||[])[1]?.toLowerCase())||w<9))return false;
 if(STOP.has((s.replace(/[.!"”)]+$/,'').match(/(\p{L}+)$/u)||[])[1]?.toLowerCase()))return false;
 if(/\?\s*$/.test(s)||/_{2,}|\.{3,}|…/.test(s))return false;
 if(/[=→←⇒|<>{}\[\]]/.test(s)||/https?:|www\.|@/.test(s))return false;
 if(/^\d+[.)]\s/.test(s))return false;
 if(QG_META.test(s)||QG_DANGLE.test(s)||QG_IMP.test(s))return false;
 if(!QG_VERB.test(s))return false;
 if((s.match(/\p{L}/gu)||[]).length/s.length<.72)return false;
 const ws=s.match(/\p{L}+/gu)||[];
 if(ws.length>=4&&ws.filter(x=>/^\p{Lu}/u.test(x)).length/ws.length>.6)return false;
 if(capsHeavy(s))return false;
 if((s.match(/\(/g)||[]).length!==(s.match(/\)/g)||[]).length)return false;
 return true;
}

/* ---------- 2. definitions ("X is defined as ...", "... is called X", "X refers to ...", "X is a ...") ---------- */
function qgDef(s){
 const t=s.replace(/[.!]+$/,'');let m,term=null,def=null;
 const okT=x=>{
  x=String(x||'').trim().replace(/^(?:an?|the)\s+/i,'');
  const ws=x.split(/\s+/);
  if(!x||ws.length>4||/[,;:()"“]/.test(x)||QG_PRON.test(x)||/\b(?:is|are|was|were|can|will|has|have|do|does|may|must)\b/i.test(x))return null;
  if(!ws.some(qgKey)||STOP.has(ws[0].toLowerCase()))return null;
  return x;
 };
 if((m=t.match(/^(.{3,60}?)\s+(?:is|are)\s+(?:defined as|described as|referred to as)\s+(.{12,})$/i))){term=okT(m[1]);def=m[2]}
 else if((m=t.match(/^(.{12,}?)\s+(?:is|are)\s+(?:called|known as|termed|named)\s+(?:the\s+)?([^,;]{3,40})$/i))){term=okT(m[2]);def=m[1]}
 else if((m=t.match(/^(.{3,60}?)\s+(?:refers? to|means|denotes)\s+(.{12,})$/i))){term=okT(m[1]);def=m[2]}
 else if((m=t.match(/^(?:an?|the)?\s*([\p{L}][\p{L}\- ]{2,40}?)\s+(?:is|are)\s+((?:an?|the|any|one of)\s.{14,})$/iu))){term=okT(m[1]);def=m[2]}
 if(!term||!def)return null;
 def=def.trim();
 if(def.split(/\s+/).length<5||QG_DANGLE.test(def)||def.toLowerCase().includes(term.toLowerCase()))return null;

}

/* ---------- 3. analyse the lesson ---------- */
function qgFeat(x){
 const s=x.s;
 return {len:s.length,def:!!x.def,num:/\d/.test(s),
  cause:/\b(because|therefore|thus|as a result|results? in|leads? to|led to|causes?|caused|due to|so that|consequently)\b/i.test(s),
  cmp:/\b(while|whereas|unlike|compared|rather than|differs?|different from|than|both|either)\b/i.test(s)};
}
function qgLvl(f,lvl){
 if(lvl==='Beginner')return (f.def?3:0)+(f.len<=120?2:f.len>170?-3:0)+(f.cause?-1.5:0)+(f.cmp?-1:0);
 if(lvl==='Advanced')return (f.cause?2.5:0)+(f.cmp?2:0)+(f.len>=100?1.5:f.len<75?-3:0)+(f.num?1.5:0)+(f.def?-1:0);
 return (f.def?1.2:0)+(f.len>=70&&f.len<=170?1.5:0)+(f.cause?1.2:0)+(f.num?.5:0);
}
function qgPrep(text){
 const seen=new Set(),sents=[];
 qgItems(text).forEach(it=>{
  const s=it.s.replace(/\s+/g,' ').replace(/^[“"]+|[”"]+$/g,'').trim(),k=s.toLowerCase();
  if(seen.has(k)||!qgSentOK(s,it.bul))return;
  seen.add(k);sents.push({s,topic:it.topic||'',idx:sents.length,h:g2hash(s)});
 });
 const bi={},capMid={},lowMid={},artB={};
 sents.forEach(x=>{
  x.t=toks(x.s);
  x.t.forEach((o,j)=>{
   if(!qgKey(o.w))return;
   const l=o.w.toLowerCase();
   if(j>0){if(/^\p{Lu}/u.test(o.w)&&!qgAcr(o.w))capMid[l]=(capMid[l]||0)+1;else lowMid[l]=(lowMid[l]||0)+1;if(/^(?:the|a|an|its|their|of|this|each|any|some|our|his|her)$/i.test(x.t[j-1].w))artB[l]=1}
   if(j+1<x.t.length&&x.t[j+1].adj&&qgKey(x.t[j+1].w)){const k2=l+' '+x.t[j+1].w.toLowerCase();bi[k2]=(bi[k2]||0)+1}
  });
 });
 const tinfo={},df={};
 const mkT=(k,d)=>{
  if(!tinfo[k]){const proper=k.split(' ').some(w=>capMid[w]&&!lowMid[w]);const ws=k.split(' '),last=ws[ws.length-1];tinfo[k]={k,d:qgAcr(d)||proper?d:d.toLowerCase(),proper,noun:ws.length>1||qgAcr(d)||proper||!!artB[last]||(/(?:tion|sion|ment|ity|ism|ness|ance|ence|ology|ics|ide|ure|ist|ware|work|ase)$/.test(last))}}
  return tinfo[k];
 };
 sents.forEach(x=>{
  x.def=qgDef(x.s);
  const ks=new Set();
  x.t.forEach((o,j)=>{
   if(!qgKey(o.w))return;
   const l=o.w.toLowerCase();ks.add(mkT(l,o.w).k);
   if(j+1<x.t.length&&x.t[j+1].adj&&qgKey(x.t[j+1].w)){const k2=l+' '+x.t[j+1].w.toLowerCase();if(bi[k2]>=2)ks.add(mkT(k2,o.w+' '+x.t[j+1].w).k)}
  });
  if(x.def){const t=mkT(x.def.k,x.def.term);t.def=1;t.noun=true;t.d=qgAcr(x.def.term)||t.proper?x.def.term:x.def.term.toLowerCase();ks.add(x.def.k)}
  x.c=[...ks];ks.forEach(k=>{df[k]=(df[k]||0)+1});
 });
 const nS=sents.length;
 Object.values(tinfo).forEach(t=>{t.df=df[t.k]||1;t.multi=t.k.includes(' ')});
 const topicTerms={};
 sents.forEach(x=>{x.c=x.c.map(k=>tinfo[k]);x.f=qgFeat(x);(topicTerms[x.topic]=topicTerms[x.topic]||new Set());x.c.forEach(t=>topicTerms[x.topic].add(t.k))});
 const defs=[],dk=new Set();
 sents.forEach(x=>{if(x.def&&!dk.has(x.def.k)){dk.add(x.def.k);defs.push(x.def)}});
 const terms=Object.values(tinfo);
 const concepts=terms.filter(t=>!t.multi||t.df>=2).sort((a,b)=>(b.df*(b.multi?1.6:1)+(b.def?3:0))-(a.df*(a.multi?1.6:1)+(a.def?3:0))).slice(0,8).map(t=>t.d);

}

/* ---------- 4. blanks and wrong choices ---------- */
function qgBlank(s,term){
 const m=new RegExp('(^|[^\\p{L}])('+reEsc(term)+')((?:s|es)?)(?![\\p{L}])','iu').exec(s);

 if((out.match(/\p{L}{4,}/gu)||[]).filter(w=>!STOP.has(w.toLowerCase())).length<3)return null;

}
function qgTarget(x,P,lvl,ban){
 const beg=lvl==='Beginner',adv=lvl==='Advanced',pool=[];
 if(x.def&&P.byK[x.def.k])pool.push(P.byK[x.def.k]);
 x.c.forEach(t=>{if(!pool.includes(t))pool.push(t)});
 let best=null,bs=-1e9;
 pool.forEach(t=>{
  if(ban.has(t.k)||!t.noun||qgOcc(x.s,t.k)!==1)return;
  if(x.c.some(o=>o!==t&&o.k.includes(' ')&&o.k.includes(t.k)&&qgOcc(x.s,o.k)))return;
  if(!qgBlank(x.s,t.d))return;
  let v=Math.log((P.nS+1)/t.df)*(beg?.6:1)+Math.random()*1.4;
  if(P.nS>=6&&t.df/P.nS>.35)v-=3;
  if(t.multi)v+=adv?1.2:beg?-.4:.4;
  if(t.proper)v+=.6;
  const last=t.k.split(' ').pop();
  if(/(?:tion|sion|ment|ity|ism|ness|ance|ence|ology|ics|ase|ide|ure|ist|ware|work)$/.test(last))v+=.8;
  if(/(?:ing|ed)$/.test(last))v-=1.5;
  if(qgAdj.test(last))v-=1;
  if(last.length>=7)v+=.4;
  if(x.def&&t.k===x.def.k)v+=beg?3:adv?-1:1;
  if(P.seenA.has(norm(t.d)))v-=6;
  if(v>bs){bs=v;best=t}

}
function qgDis(P,x,T,need,lvl,b,sameTopic){
 /* sameTopic=true is used for false statements: only swap one defined concept for a sibling concept (mitosis <-> meiosis) */
 const sl=qgNorm(x.s),sLow=x.s.toLowerCase(),tk=T.k,kt=qgKind(T),near=P.topicTerms[x.topic];
 const lastW=b&&b.before?(b.before.match(/(\p{L}+)\W*$/u)||[])[1]:'',nextW=b&&b.after?(b.after.match(/^\W*(\p{L}+)/u)||[])[1]:'';

  if(sameTopic&&!(t.def&&near&&near.has(t.k)))return false;
  if(!t.noun||t.k===tk||qgKind(t)!==kt||t.k.includes(tk)||tk.includes(t.k)||t.k.slice(0,5)===tk.slice(0,5))return false;
  if(sl.includes(' '+t.k+' ')||sLow.includes(t.k.slice(0,Math.max(5,t.k.length-2))))return false;
  if(P.nS>=6&&t.df/P.nS>.4)return false;
  /* the wrong choice must not fit the same context somewhere else in the lesson */
  if(lastW&&qgKey(lastW)&&P.low.includes(' '+lastW.toLowerCase()+' '+t.k+' '))return false;
  if(nextW&&qgKey(nextW)&&P.low.includes(' '+t.k+' '+nextW.toLowerCase()+' '))return false;
  return true;
 };
 const sc=t=>{
  const sim=-Math.abs(t.k.length-tk.length)/6,top=near&&near.has(t.k)?1:0;
  return lvl==='Beginner'?-top*.5+Math.random()*2:lvl==='Advanced'?sim*1.2+top*1.5+Math.random()*.6:sim*.6+top*.6+Math.random()*1.2;
 };
 const out=[],used=new Set([tk.slice(0,5)]);
 for(const t of P.terms.filter(ok).sort((a,b)=>sc(b)-sc(a))){
  const p=t.k.slice(0,5);if(used.has(p))continue;
  used.add(p);out.push(t.d);if(out.length>=need)break;
 }

}

/* ---------- 5. safe ways to make a statement false ---------- */
function qgAnt(s){
 for(const [a,b] of QG_ANT)for(const [p,q] of [[a,b],[b,a]]){
  const re=new RegExp('\\b'+p+'\\b','i'),m=s.match(re);
  if(m)return s.replace(re,m[0][0]===m[0][0].toUpperCase()?cap(q):q);

/* ---------- 6. build ONE question of a given style ---------- */
function qgQ(x,kind,lvl,P,st,ban){
 const s=x.s,beg=lvl==='Beginner',adv=lvl==='Advanced',nch=beg?2:3,dd=x.def;
 const TD=dd?(P.byK[dd.k]||{k:dd.k,d:dd.term}):null;
 const mk=(t,q,ch,a,k)=>{
  if(ch){const sn=new Set();for(const c of ch){const nc=norm(c);if(!nc||sn.has(nc))return null;sn.add(nc)}ch=shuf(ch)}
  const o={t,q,a,src:s,h:x.h,_k:k};if(ch)o.ch=ch;return o;
 };
 const B={
  blankMC:()=>{
   const T=qgTarget(x,P,lvl,ban);if(!T)return null;const b=qgBlank(s,T.d);if(!b)return null;
   const ds=qgDis(P,x,T,nch,lvl,b);if(ds.length<nch)return null;
   return mk('mc',(beg?'Fill in the blank: ':adv?'Choose the term that correctly completes the statement: ':'Choose the term that best completes the sentence: ')+b.text,[cap(T.d),...ds.map(cap)],cap(T.d),T.k);
  },
  blankID:()=>{
   const T=qgTarget(x,P,lvl,ban);if(!T||T.d.split(' ').length>2||s.split(/\s+/).length<8)return null;
   const b=qgBlank(s,T.d);if(!b)return null;

  },
  defMC:()=>{
   if(!dd||!TD)return null;
   const dq=dd.def,od=shuf(P.defs.filter(y=>y.k!==dd.k&&!dq.toLowerCase().includes(y.k)).map(y=>(P.byK[y.k]||{d:y.term}).d));
   const g=qgDis(P,x,TD,nch,lvl,null).filter(d=>!dq.toLowerCase().includes(d.toLowerCase()));
   const seen=new Set([TD.d.toLowerCase()]),ds=[];
   for(const d of (adv?[...g,...od]:[...od,...g])){const l=d.toLowerCase();if(seen.has(l)||l.slice(0,5)===TD.d.toLowerCase().slice(0,5))continue;seen.add(l);ds.push(d);if(ds.length>=nch)break}
   if(ds.length<nch)return null;

  },
  defID:()=>{
   if(!dd||!TD)return null;

  },
  termDef:()=>{
   if(!dd||beg)return null;
   const od=P.defs.filter(y=>y.k!==dd.k&&!y.def.toLowerCase().includes(dd.k)&&!dd.def.toLowerCase().includes(y.k));
   if(od.length<3)return null;
   const wds=d=>d.toLowerCase().split(/\W+/).filter(Boolean),dw=new Set(wds(dd.def));
   const sim=y=>{const b=wds(y.def);return b.filter(w=>dw.has(w)).length/(b.length+1)},lenD=y=>Math.abs(y.def.length-dd.def.length);
   const pick=adv?od.slice().sort((a,b)=>sim(b)-sim(a)||lenD(a)-lenD(b)).slice(0,6):od.slice().sort((a,b)=>lenD(a)-lenD(b)).slice(0,6);
   const right=cap(dd.def),ds=shuf(pick).slice(0,3).map(y=>cap(y.def));
   return mk('mc',adv?`Which of the following most accurately describes ${TD.d}?`:`According to the lesson, which of the following best describes ${TD.d}?`,[right,...ds],right,dd.k);
  },
  which:()=>{
   if(s.length>220)return null;
   const w=qgFalse(x,P,lvl,3);if(w.length<3)return null;
   return mk('mc','Which of the following statements is correct?',[s,...w].map(cap),cap(s),x.c[0]?x.c[0].k:s.slice(0,8));
  },
  notTrue:()=>{
   if(s.length>200)return null;
   const bad=qgFalse(x,P,lvl,1)[0];if(!bad)return null;
   const oth=P.sents.filter(o=>o!==x&&o.s.length<=200);

/* ---------- 7. generate(): same signature as before, plus optional retake options ---------- */
function generate(text,n,types,level,opt){
 opt=opt||{};
 const lvl=LEVELS.includes(level)?level:'Intermediate',P=qgPrep(text),cs=P.sents;
 const bad='Could not find enough clean lesson sentences to build questions. Make sure the lesson has full sentences (not only titles, lists or a worksheet header).';
 if(!cs.length)return {qs:[],note:bad,concepts:P.concepts};
 const M=g2mem[g2hash(text)]||(g2mem[g2hash(text)]={sent:new Set(),ans:new Set()});
 let usedH,avoidQ=[];
 if(opt.retake){usedH=new Set((opt.avoidH||[]).map(String));P.seenA=new Set((opt.avoidA||[]).map(norm));avoidQ=opt.avoidQ||[]}
 else{
  if(M.sent.size>=cs.length*.7){M.sent.clear();M.ans.clear()}
  const old=new Set();
  S.activities.forEach(a=>(a.qs||[]).forEach(q=>{if(q&&q.t!=='tf'&&q.a)old.add(norm(q.a))}));
  usedH=M.sent;P.seenA=new Set([...M.ans,...old]);
 }
 const qTxt=new Set(avoidQ),prevW=avoidQ.map(q=>new Set(qgW(q)));
 const reject=(q,x)=>{
  if(qTxt.has(q.q))return true;
  if(!opt.retake)return false;
  if(opt.tier>=3)return false;
  if(opt.tier!==2){const w=qgW(q.q);if(w.length>=3&&prevW.some(S2=>w.filter(y=>S2.has(y)).length/w.length>=.6))return true}
  if(q.t!=='tf'&&P.seenA.has(norm(q.a)))return true;
  if(usedH.has(String(x.h))&&q.t==='tf')return true;
  return false;
 };
 const slots=Array.from({length:n},(_,i)=>types[i%types.length]),tp=types.length>1?shuf(slots):slots;
 const out=[],usedS=new Set(),ban=new Set(),usedA=new Set(),usedQ=new Set(),st={tf:Math.floor(Math.random()*2),k:{}};
 const sc=x=>x.f?qgLvl(x.f,lvl)+(lvl==='Beginner'&&x.topic&&(x.idx===0||P.sents[x.idx-1].topic!==x.topic)?1.5:0)-(usedH.has(String(x.h))?(opt.retake?8:50):0)+Math.random()*3:0;
 const tryC=(x,type)=>{
  const ks=(QG_K[lvl][type]||[]).map(k=>[k,(st.k[k]||0)+Math.random()*1.2-(x.def&&/^(def|termDef)/.test(k)?1.5:0)]).sort((a,b)=>a[1]-b[1]);
  for(const [k] of ks){
   const q=qgQ(x,k,lvl,P,st,ban);
   if(!q||usedQ.has(q.q)||(q.t!=='tf'&&usedA.has(norm(q.a)))||reject(q,x))continue;
   st.k[k]=(st.k[k]||0)+1;usedQ.add(q.q);if(q.t!=='tf')usedA.add(norm(q.a));
   return q;
  }
  return null;
 };
 const take=x=>{const want=tp[out.length]||tp[0];let q=tryC(x,want);if(!q)for(const alt of ['tf','id','mc'])if(alt!==want&&types.includes(alt)){q=tryC(x,alt);if(q)break}if(q){out.push({q,idx:x.idx});usedS.add(x);ban.add(q._k)}return q};
 /* pass 1: cut the lesson into as many parts as questions and take the best sentence of each part */
 const m=Math.min(n,cs.length);
 for(let i=0;i<m;i++){
  const seg=cs.slice(Math.floor(i*cs.length/m),Math.floor((i+1)*cs.length/m)).filter(x=>!usedS.has(x)).map(x=>[x,sc(x)]).sort((a,b)=>b[1]-a[1]);
  for(const [x] of seg)if(take(x))break;

 /* pass 2: fill gaps from anywhere (same concept may repeat only if nothing else works) */
 for(const relax of [false,true]){
  if(out.length>=n)break;
  if(relax)ban.clear();
  for(const [x] of cs.filter(y=>!usedS.has(y)).map(y=>[y,sc(y)]).sort((a,b)=>b[1]-a[1])){if(out.length>=n)break;take(x)}
 }
 out.sort((a,b)=>a.idx-b.idx);
 if(!opt.retake)out.forEach(o=>{M.sent.add(o.q.h);if(o.q.t!=='tf')M.ans.add(norm(o.q.a))});

 let note='';
 if(!qs.length)note=bad;
 else if(qs.length<n)note=`Only ${qs.length} good question(s) could be built from this lesson (you asked for ${n}). Add more lesson text for more.`;

}

/* ---------- 8. retake: a NEW set, never blocked ---------- */
function qgRetake(a,prev){

  if(typeof e==='string'){const v=e.slice(2);if(e[0]==='h')H.add(v);else if(e[0]==='a')A.add(v);else if(e[0]==='q')Q.add(v)}
  else add(e);

 let out=[],same=false;
 if(text){
  const sc=scanMath(text),tx=text.split('\n').filter(l=>!sc.lines.has(l.trim())).join('\n');
  const mq=mathQuestions(sc,n*2,types,a.level).filter(q=>!Q.has(q.q));
  const solveOnly=a.qs.length&&a.qs.every(q=>q.c==='solve'),mAlloc=Math.min(mq.length,solveOnly?n:Math.ceil(n/2)),need=n-mAlloc;
  const base={retake:true,avoidH:[...H],avoidA:[...A],avoidQ:[...Q]};
  let tq=need>0?generate(tx,need,types,a.level,{...base,tier:1}).qs:[];
  if(tq.length<need){
   const r2=generate(tx,need-tq.length,types,a.level,{...base,tier:2,avoidH:[...H,...tq.map(q=>q.h)],avoidQ:[...Q,...tq.map(q=>q.q)]});
   tq=[...tq,...r2.qs];
  }
  if(tq.length<need){
   const r3=generate(tx,need-tq.length,types,a.level,{...base,tier:3,avoidH:[...H,...tq.map(q=>q.h)],avoidQ:[...Q,...tq.map(q=>q.q)]});
   tq=[...tq,...r3.qs];
  }
  out=[...tq,...mq.slice(0,mAlloc)];

  /* lesson is too short or gone: reshuffle the original questions instead of blocking the student */

function rtFresh(a,seen){const r=qgRetake(a,{seen:seen||[]});return r.same?null:r.qs}

function qgLev(a,b){

  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));

}
function qgClose(a,b){

/* ---------- 10. math lessons: add problems the student must SOLVE (new numbers every time) ---------- */
let qgMathText='';
const qgScanPrev=window.scanMath;

const qgRI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const qgSupN='⁰¹²³⁴⁵⁶⁷⁸⁹';
function qgPoly(co,asc){

  const c=co[i],p=d-i;if(!c)return;

}
const qgEv=(co,x)=>co.reduce((a,c)=>a*x+c,0);

  degree:()=>{const co=qgCo(qgRI(2,adv?6:4),r),f=qgPoly(co,adv);return {q:`What is the degree of the polynomial f(x) = ${f}?`,s:`The degree of f(x) = ${f} is `,val:co.length-1}},
  lead:()=>{const co=qgCo(qgRI(2,4),r),f=qgPoly(co,!beg);return {q:`What is the leading coefficient of f(x) = ${f}?`,s:`The leading coefficient of f(x) = ${f} is `,val:co[0]}},
  constant:()=>{const co=qgCo(qgRI(2,4),r),f=qgPoly(co,!beg);return {q:`What is the constant term of f(x) = ${f}?`,s:`The constant term of f(x) = ${f} is `,val:co[co.length-1]}},
  remainder:()=>{const co=qgCo(3,r),c=qgRI(-3,3)||2,f=qgPoly(co);return {q:`Using the Remainder Theorem, find the remainder when f(x) = ${f} is divided by x ${sg(-c)}.`,s:`The remainder when f(x) = ${f} is divided by x ${sg(-c)} is `,val:qgEv(co,c)}},

const qgMQPrev=window.mathQuestions;

};


/* ---------- 11. "Solving" classification in Create Quiz ---------- */
let qgSel='';
const qgCQPrev=window.CreateQuiz;
window.CreateQuiz=function(){
 let h=qgCQPrev();
 h=h.replace('<option value="id">Identification</option>','<option value="id">Identification</option><option value="solve">Solving (math problems)</option><option value="mixsolve">Mixed + Solving</option>');
 if(qgSel)h=h.replace('<option value="'+qgSel+'">','<option value="'+qgSel+'" selected>');
 return h;
};
const qgGenPrev=window.gen;
window.gen=function(){
 const t=val('gt');
 qgSel=t;
 if(t!=='solve'&&t!=='mixsolve')return qgGenPrev();
 const m=S.materials.find(x=>x.id===val('gm'));if(!m){alert('Upload a lesson first.');return}
 const text=(m.text||'').trim();
 if(!text){alert('This lesson has no readable text. Paste the lesson text, or upload a file that contains text.');return}
 const lvl=val('gl')||m.level,n=+val('gn')||5;
 qgMathText=text;
 const sc=scanMath(text),tx=text.split('\n').filter(l=>!sc.lines.has(l.trim())).join('\n');
 const seen=new Set(),mq=window.mathQuestions(sc,n*3,['id','id','mc'],lvl).filter(q=>!seen.has(q.q)&&seen.add(q.q));
 if(!mq.length){alert('This lesson does not look like a math / problem-solving lesson. Solving problems need words like equation, polynomial, quadratic, coefficient, zeros or roots in the lesson.');return}
 let qs,concepts=['problem solving'];
 if(t==='solve')qs=mq.slice(0,n);
 else{
  const k=Math.min(mq.length,Math.ceil(n/2)),r=generate(tx,n-k,['mc','tf','id'],lvl);
  qs=[...r.qs.slice(0,n-k),...mq.slice(0,Math.max(k,n-r.qs.length))].slice(0,n);
  concepts=[...(r.concepts||[]),'problem solving'];
 }
 const note=qs.length<n?`Only ${qs.length} question(s) could be built (you asked for ${n}).`:'';
 draft={title:m.title+(t==='solve'?' Problem Solving':' Quiz'),level:lvl,section:m.section,qs,note,concepts,mat:m.id};
 render();
};
</script>
