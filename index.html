body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;min-height:100vh}

header b{font-size:18px}

nav button.on,nav button:hover{background:rgba(255,255,255,.2)}

.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:18px;margin-bottom:16px;overflow-x:auto}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>

/* =========== SETUP: Firebase config =========== */
const FIREBASE_CONFIG={
 apiKey:"AIzaSyBiQeudblgek02MQo1TsJSXoAAOw30CQgM",authDomain:"classroom-76d38.firebaseapp.com",projectId:"classroom-76d38",appId:"1:637359880930:web:b71459ae37f955d0783cbb"};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),col=n=>db.collection(n);

/* live copy of the database */
const D={},active={},dying=new Set();
const flat=p=>Object.keys(D).filter(k=>k.startsWith(p)).flatMap(k=>D[k]);
const S={
 get hosted(){return (D.hosted||[]).filter(s=>!dying.has(s.id))},
 get mine(){return D.mine||[]},
 get joined(){return flat('sec:')},
 get sections(){return [...this.hosted,...this.joined]},
 get materials(){return flat('mat:')},
 get activities(){return flat('act:')},
 get subs(){return [...flat('hsub:'),...(D.mysubs||[])]},
 get students(){return flat('mem:').map(m=>({id:m.student,mid:m.id,section:m.section,name:m.name,email:m.email}))}
};
let me=null,authed=null,loaded={},msg='',mode=null,joinInfo=null;
let tab='',draft=null,taking=null,trackSec='all',trackStu=null,pend=false;
let uploadedFileMeta=null,fileBusy=false;
let joinCode=(new URLSearchParams(location.search).get('join')||'').trim().toLowerCase()||null;
const LEVELS=['Beginner','Intermediate','Advanced'];
const secName=id=>(S.sections.find(s=>s.id===id)||{}).name||'-';
const joinLink=s=>location.origin+location.pathname+'?join='+s.id;
const curMode=()=>mode||(S.hosted.length?'teacher':S.mine.length?'student':null);

/* ---------- auth + live data ---------- */
function signIn(){
 msg='';const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
 auth.signInWithPopup(p).catch(e=>{msg=e.message;render()})
}
function logout(){auth.signOut()}
function unlisten(k){if(active[k]){active[k]();delete active[k]}delete D[k];delete loaded[k]}
function stop(){Object.keys(active).forEach(unlisten);Object.keys(D).forEach(k=>delete D[k]);loaded={};dying.clear()}
const BASE=['hosted','mine','mysubs'];
function listen(k,q){
 if(active[k])return;
 active[k]=q.onSnapshot(s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[k]=1;sync()},
  e=>{console.error(k,e);if(e.code==='permission-denied'&&!BASE.includes(k))return;msg='Database error ('+k+'): '+e.code;loaded[k]=1;render()})
}
function listenDoc(k,ref){
 if(active[k])return;
 active[k]=ref.onSnapshot(d=>{D[k]=d.exists?[{id:d.id,...d.data()}]:[];loaded[k]=1;sync()},
  e=>{console.error(k,e);if(e.code==='permission-denied')return;msg='Database error ('+k+'): '+e.code;render()})
}

function wire(){
 if(!authed)return;
 const want=new Set();
 S.hosted.forEach(s=>['mat','act','hsub','mem'].forEach(p=>want.add(p+':'+s.id)));
 S.mine.forEach(m=>['sec','mat','act'].forEach(p=>want.add(p+':'+m.section)));
 want.forEach(k=>{
  const i=k.indexOf(':'),p=k.slice(0,i),id=k.slice(i+1);
  if(p==='mat')listen(k,col('materials').where('section','==',id));
  else if(p==='act')listen(k,col('activities').where('section','==',id));
  else if(p==='hsub')listen(k,col('subs').where('section','==',id));
  else if(p==='mem')listen(k,col('members').where('section','==',id));
  else if(p==='sec')listenDoc(k,col('sections').doc(id));
 });
 Object.keys(active).filter(k=>k.includes(':')&&!want.has(k)).forEach(unlisten);
}
auth.onAuthStateChanged(u=>{
 stop();authed=u;mode=null;joinInfo=null;me=u?{id:u.uid,name:u.displayName||u.email||'Me',email:(u.email||'').toLowerCase()}:null;
 if(u){
  listen('hosted',col('sections').where('host','==',u.uid));
  listen('mine',col('members').where('student','==',u.uid));
  listen('mysubs',col('subs').where('student','==',u.uid));
  fetchJoin();
 }
 render();
});
function sync(){wire();soft()}
async function fetchJoin(){
 if(!authed||!joinCode)return;
 try{const d=await col('sections').doc(joinCode).get();joinInfo=d.exists?{id:d.id,...d.data()}:{bad:1}}
 catch(e){console.error(e);joinInfo={bad:1}}
 render();
}
function soft(){
 const a=document.activeElement;
 if(taking)return;
 if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.readOnly){pend=true;return}
 render();
}
document.addEventListener('focusout',()=>{if(pend){pend=false;setTimeout(()=>{if(!taking)render()},300)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

/* =====================================================================
   CONTENT ANALYSIS + QUIZ GENERATOR
   Pipeline: clean text -> find headings/sentences -> detect definitions
   -> weight key concepts -> pick the best "teachable" sentences ->
   build questions with smart distractors, styled by difficulty level.
   ===================================================================== */
const STOP=new Set(('a an the and or but if then else when while of at by for with about against between into through during before after above below to from up down in out on off over under again further once here there all any both each few more most other some such no nor not only own same so than too very can will just should now is are was were be been being have has had do does did this that these those it its they them their he she his her we our you your i me my also may might must shall would could which who whom whose what where why how as because since until although however therefore thus hence per via among within without upon one two three first second third many much called known using used make made often important different various include includes including example examples given based type types like well even still every another around usually generally sometimes ang ng sa na at ay mga ito para ni kay din rin ba po lang ko mo niya sila kami tayo kung kapag dahil pero ngunit pa review companion unit lesson chapter topic learning competency competencies target material materials day days objective objectives activity activities page contain contains produce produces occur occurs form forms replace replaces describe describes consist consists become becomes').split(' '));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isKey=w=>!STOP.has(w.toLowerCase())&&(w.length>=4||/^\p{Lu}{2,6}$/u.test(w));
function toks(s){
 const out=[],re=/\p{L}+(?:[-'’]\p{L}+)*/gu;let m,prev=-1;
 while((m=re.exec(s))){out.push({w:m[0].replace(/['’]s$/i,''),i:m.index,adj:prev>=0&&/^\s+$/.test(s.slice(prev,m.index))});prev=m.index+m[0].length}
 return out;
}

/* 1. Remove worksheet headers, page numbers, names/dates, repeated header/footer lines (only whole noise LINES are removed,
      so educational sentences that merely contain words like "class" or "subject" are kept). */
const NOISE_LABEL=/^(name|date|score|section|grade|teacher|instructor|professor|school|class|subject|course|student|directions?|instructions?|time allowed|total points?)\s*[:_\-–]/i;
const NOISE_ORG=/\b(university|college|school|academy|department|faculty|campus|institute)\b/i;
function isNoiseLine(l){
 if(/^[\d\W_]+$/.test(l))return true;
 if(/^(page\s*)?\d+(\s*(of|\/)\s*\d+)?$/i.test(l))return true;
 if(NOISE_LABEL.test(l))return true;
 if(/(https?:\/\/|www\.|@\w+\.\w+)/i.test(l))return true;
 if(/copyright|all rights reserved|©/i.test(l))return true;
 if(l.length<70&&NOISE_ORG.test(l)&&!/[.!?]$/.test(l))return true;
 if(/^(mon|tues?|wednes|thurs?|fri|satur|sun)day,?\s/i.test(l)||/^[A-Za-z]+ \d{1,2},? \d{4}$/.test(l))return true;
 return false;
}
/* Only titles / unit / competency labels are filtered out. Everything else that is lesson content is kept:
   full sentences, bullet points, equations, tables and ALL-CAPS slide lines. */
const NOISE_SENT=/\b(learning competenc\w*|target competenc\w*|competenc(?:y|ies)|LC\s?\d+|learning objectives?|unit\s*\d+|chapter\s*\d+|lesson\s*\d+|module\s*\d+|days?\s*\d+\s*[-–—]\s*\d+|week\s*\d+)\b/i;
const SYM=/[→←⇒=+|&\/]/;
const capsHeavy=s=>{const w=(s.match(/\p{L}+/gu)||[]).filter(x=>x.length>=3);return w.length>=2&&w.filter(x=>x===x.toUpperCase()).length/w.length>0.5};
const isFrag=s=>SYM.test(s)||capsHeavy(s);
function cleanLines(raw){
 const lines=String(raw||'').replace(/\r/g,'').replace(/[ \t]*[•●▪◦][ \t]*/g,'\n• ').split('\n').map(l=>l.replace(/\s+/g,' ').trim());
 const cnt={},key=l=>l.toLowerCase().replace(/\d+/g,'#');
 lines.forEach(l=>{if(l&&l.length<80)cnt[key(l)]=(cnt[key(l)]||0)+1});
 return lines.filter(l=>!l||(!(l.length<80&&cnt[key(l)]>=3)&&!isNoiseLine(l)));
}
function splitSentences(p){
 const t=p.replace(/\b(e\.g|i\.e|etc|vs|fig|dr|mr|mrs|ms|prof|no|approx|st)\./gi,m=>m.slice(0,-1)+'\u0001').replace(/(\d)\.(\d)/g,'$1\u0001$2');
 return t.split(/(?<=[.!?])\s+(?=[\p{Lu}\d"'(])/u).map(s=>s.replace(/\u0001/g,'.').trim()).filter(Boolean);
}

/* 2. Definition detection ("X is defined as...", "X refers to...", "X is a ...", "X: ...") */
const DEFRE=[
 /^(?:(?:an?|the)\s+)?([\p{L}][\p{L}\- ]{2,45}?)\s+(?:is|are)\s+(?:defined as|called|known as|referred to as|described as)\s+(.{12,})$/iu,
 /^(?:(?:an?|the)\s+)?([\p{L}][\p{L}\- ]{2,45}?)\s+(?:refers to|means|denotes)\s+(.{12,})$/iu,
 /^(?:(?:an?|the)\s+)?([\p{L}][\p{L}\- ]{2,45}?)\s+(?:is|are)\s+((?:an?|the|any|one of)\s.{12,})$/iu,
 /^([\p{L}][\p{L}\- ]{2,40}?)\s*[:–—]\s+(.{15,})$/u
];
const BADTERM=/^(it|this|that|these|those|they|he|she|there|we|you|which|what|who|example|note|remember|tip|question|answer|figure|table|step)\b/i;
function findDef(s){
 for(const re of DEFRE){
  const m=s.match(re);if(!m)continue;
  const term=m[1].trim().replace(/^(?:an?|the)\s+/i,''),def=m[2].trim().replace(/[.!]+$/,'');
  const ws=term.split(/\s+/);
  if(ws.length>4||BADTERM.test(term)||!ws.some(isKey)||/[,;()]/.test(term))continue;
  if(ws.some(w=>STOP.has(w.toLowerCase())&&w.toLowerCase()!=='of'))continue;
  if(def.split(/\s+/).length<4)continue;
  return {term,k:term.toLowerCase(),def};
 }
 return null;
}

/* 3. Analyze the whole lesson */
function analyze(raw){
 const lines=cleanLines(raw),sents=[],headK=new Set();let topic='',buf=[];
 /* the document's title block (first line) is not lesson content */
 const fi=lines.findIndex(l=>l);
 if(fi>=0){const t=lines[fi];if(t.split(' ').length>=3&&t.length<=150&&!/[.!?:]$/.test(t)&&!/^(•|●|▪|\*|-|–|\d+[.)])\s/.test(t)&&!isFrag(t))lines[fi]=''}
 const flush=()=>{if(buf.length)splitSentences(buf.join(' ')).forEach(s=>sents.push({s,topic}));buf=[]};
 const BUL=/^(•|●|▪|\*|-|–|\d+[.)])\s+/;
 lines.forEach(l=>{
  if(!l){flush();return}
  const bullet=BUL.test(l),b=l.replace(BUL,'');
  const wc=b.split(' ').length;
  /* equations, tables, ALL-CAPS slide lines: each line is its own piece of content */
  if(isFrag(b)){flush();sents.push({s:b,topic,frag:true});return}
  if(bullet&&wc>=3){flush();splitSentences(b).forEach(s=>sents.push({s,topic}));return}
  if(b.length<70&&!/[.!?:,;]$/.test(b)&&wc<=8&&!/\b(is|are|was|were)\b/i.test(b)){
   flush();topic=b;toks(b).forEach(t=>isKey(t.w)&&headK.add(t.w.toLowerCase()));return;
  }
  buf.push(b);
 });
 flush();
 const S2=sents.filter(x=>{
  const w=x.s.split(/\s+/).length;
  return w>=3&&w<=60&&x.s.length<=320&&(x.s.match(/\p{L}{2,}/gu)||[]).length>=2&&!/\?$/.test(x.s)&&!/^(figure|fig\.|table\s*\d|source:)/i.test(x.s)&&!NOISE_SENT.test(x.s);
 });
 const freq={},bi={},capMid={},lowMid={},acr={};
 S2.forEach(({s})=>{
  const t=toks(s);
  t.forEach((o,j)=>{
   if(!isKey(o.w))return;
   const l=o.w.toLowerCase();freq[l]=(freq[l]||0)+1;
   if(/^\p{Lu}{2,6}$/u.test(o.w)||/\p{Lu}/u.test(o.w.slice(1)))acr[l]=o.w;
   if(j>0){if(/^\p{Lu}/u.test(o.w)&&!/^\p{Lu}{2,}$/u.test(o.w))capMid[l]=(capMid[l]||0)+1;else lowMid[l]=(lowMid[l]||0)+1}
   if(j>0&&o.adj&&isKey(t[j-1].w)){const k=t[j-1].w.toLowerCase()+' '+l;bi[k]=(bi[k]||0)+1}
  });
 });
 const defs=[],seen=new Set();
 S2.forEach(x=>{x.def=findDef(x.s);if(x.def&&!seen.has(x.def.k)){seen.add(x.def.k);defs.push(x.def)}});
 const defK=new Set(defs.map(d=>d.k));
 const terms={};
 const add=(k,disp,w)=>{terms[k]=terms[k]?{...terms[k],w:Math.max(terms[k].w,w)}:{k,disp,w}};
 Object.keys(freq).forEach(l=>{
  const proper=capMid[l]&&!lowMid[l];
  add(l,acr[l]||(proper?cap(l):l),1+Math.log(freq[l])+(headK.has(l)?1.5:0)+(proper?.5:0)+(l.length>=8?.4:0)+(defK.has(l)?3:0));
 });
 Object.keys(bi).filter(k=>bi[k]>=2).forEach(k=>add(k,k,2.5+Math.log(bi[k])+(defK.has(k)?3:0)));
 defs.forEach(d=>add(d.k,/^\p{Lu}{2,6}$/u.test(d.term)?d.term:d.term.toLowerCase(),5));
 const termList=Object.values(terms);
 const cands=S2.map((x,idx)=>{
  const t=toks(x.s),ks=new Set();
  t.forEach((o,j)=>{
   if(!isKey(o.w))return;
   ks.add(o.w.toLowerCase());
   if(j>0&&o.adj&&isKey(t[j-1].w))ks.add(t[j-1].w.toLowerCase()+' '+o.w.toLowerCase());
  });
  if(x.def)ks.add(x.def.k);
  const hits=[...ks].map(k=>terms[k]).filter(Boolean).sort((a,b)=>b.w-a.w);
  let sc=hits.slice(0,3).reduce((a,h)=>a+h.w,0)+(x.def?4:0)+(/\d/.test(x.s)?.5:0)+(x.s.length>=60&&x.s.length<=200?1:0);
  /* sentences that depend on earlier context ("This is...", "However...") make bad standalone questions */
  if(!x.def&&/^(this|that|these|those|it|its|they|he|she|there|such|however|therefore|thus|also|but|and|so|then|their)\b/i.test(x.s))sc-=100;
  return {...x,idx,terms:hits,score:sc};
 }).filter(c=>c.terms.length&&c.score>0);
 const concepts=[...termList].sort((a,b)=>b.w-a.w).slice(0,8).map(t=>t.disp);
 const partOf=new Set();Object.keys(bi).filter(k=>bi[k]>=2).forEach(k=>{const [w1,w2]=k.split(' ');if(freq[w1]<=bi[k]+1)partOf.add(w1);if(freq[w2]<=bi[k]+1)partOf.add(w2)});
 const topicSet={};cands.forEach(c=>{(topicSet[c.topic]=topicSet[c.topic]||new Set());c.terms.forEach(t=>topicSet[c.topic].add(t.k))});
 return {cands,termList,defs,byK:terms,concepts,topicSet,partOf};
}

/* 4. Distractors. Beginner = clearly different from the answer (easy to rule out).
      Advanced = very close to the answer (same shape, similar length, same topic) so the learner must really know it. */
function distractors(T,sent,A,need,level,topic){
 const tl=T.k,low=sent.toLowerCase(),multi=tl.includes(' '),isAc=x=>/^\p{Lu}{2,6}$/u.test(x.disp),acr=isAc(T);
 const near=A.topicSet&&A.topicSet[topic];
 const pool=A.termList.filter(x=>(acr||!isAc(x))&&(x.k.length>=4||isAc(x))&&x.k!==tl&&!low.includes(x.k)&&x.k.slice(0,5)!==tl.slice(0,5)&&!tl.includes(x.k)&&!x.k.includes(tl)&&!(x.k.length>=5&&low.includes(x.k.slice(0,5)))&&!(A.partOf&&A.partOf.has(x.k)));
 const easy=level==='Beginner',hard=level==='Advanced';
 const score=x=>{
  const same=(x.k.includes(' ')===multi?2:0)+(isAc(x)===acr?1:0)-Math.abs(x.k.length-tl.length)/6;
  const topical=near&&near.has(x.k)?1.5:0;
  const imp=Math.min(x.w,4)/2;
  if(easy)return -same*0.8+imp*0.6+Math.random()*1.5;
  if(hard)return same*1.5+topical*1.5+imp+Math.random()*0.5;
  return same+topical*0.5+imp+Math.random();
 };
 return pool.sort((a,b)=>score(b)-score(a)).slice(0,need).map(x=>x.disp);
}
const sub=(s,t,r)=>{const o=s.replace(new RegExp('(^|[^\\p{L}])'+reEsc(t)+'(?:s|es)?(?![\\p{L}])','giu'),(m,p)=>p+r);return o!==s?o:null};
const blank=(s,t)=>sub(s,t,'_____');
const fmtDef=d=>cap(d.replace(/[.!]+$/,''));

/* meaning-reversing words: used to make subtle false statements */
const ANT=[['increase','decrease'],['increases','decreases'],['increased','decreased'],['higher','lower'],['more','less'],['greater','smaller'],['larger','smaller'],['faster','slower'],['before','after'],['above','below'],['always','never'],['positive','negative'],['gain','lose'],['gains','loses'],['absorb','release'],['absorbs','releases'],['absorbed','released'],['maximum','minimum'],['inside','outside'],['all','none']];
function antonym(s){
 for(const [a,b] of ANT)for(const [x,y] of [[a,b],[b,a]]){
  const re=new RegExp('\\b'+x+'\\b','i'),m=s.match(re);
  if(m)return s.replace(re,m[0][0]===m[0][0].toUpperCase()?cap(y):y);
 }
 return null;
}

/* 5. Build one question of a given type, written for the chosen difficulty level.
      Beginner     : recall / recognition. Main concepts, short sentences, 3 clearly different choices, obvious false statements.
      Intermediate : understanding. 4 related choices, definition matching both ways, fill-in-the-blank.
      Advanced     : analysis. Details and relationships, 4 very close choices, "which statement is correct" with subtly altered
                     statements, subtle false statements (reversed meaning, changed numbers, swapped secondary concept). */
function mk(c,type,lvl,A,st){
 const s=c.s,D=c.def,beg=lvl==='Beginner',adv=lvl==='Advanced';
 let T=c.terms[0];
 if(adv&&!D&&c.terms.length>1)T=[...c.terms.slice(0,3)].sort((a,b)=>(b.k.includes(' ')?1:0)-(a.k.includes(' ')?1:0)||b.k.length-a.k.length)[0];
 if(D)T=A.byK[D.k]||T;
 if(!T)return null;
 const occ=t=>(s.match(new RegExp('(^|[^\\p{L}])'+reEsc(t.k)+'(?:s|es)?(?![\\p{L}])','giu'))||[]).length;
 /* never blank a word that appears twice in the sentence (the other copy would give the answer away) */
 if(!D&&type!=='tf'&&occ(T)>1){const alt=c.terms.find(t=>occ(t)===1);if(!alt)return null;T=alt}
 const dis=(t,n)=>distractors(t,s,A,n,lvl,c.topic);
 const nch=beg?2:3;

 const fx={
  neg:()=>{
   if(/\b(not|no|never|cannot)\b|n't/i.test(s))return null;
   const r=s.replace(/\b(is|are|was|were|can|does|do|will|has|have)\b/i,m=>m.toLowerCase()==='can'?(m[0]==='C'?'Cannot':'cannot'):m+' not');
   return r!==s?r:null;
  },
  num:()=>{
   const m=s.match(/\b\d+(?:\.\d+)?\b/);if(!m)return null;
   const v=parseFloat(m[0]);let nv;
   if(Number.isInteger(v)&&v>=1000&&v<=2100)nv=v+(Math.random()<.5?-1:1)*(3+Math.floor(Math.random()*20));
   else if(v>=10)nv=Math.round(v*(Math.random()<.5?.5:2));
   else nv=v+1+Math.floor(Math.random()*3);
   return nv===v?null:s.replace(m[0],String(nv));
  },
  ant:()=>antonym(s),
  swap:()=>{if(!D&&s.toLowerCase().indexOf(T.k)>12)return null;const d=dis(T,1)[0];return d?sub(s,T.k,d):null},
  swap2:()=>{
   const T2=c.terms.find(t=>t.k!==T.k&&!T.k.includes(t.k)&&!t.k.includes(T.k));
   if(!T2)return null;
   const d=distractors(T2,s,A,1,lvl,c.topic)[0];
   return d?sub(s,T2.k,d):null;
  }
 };
 const falsify=order=>{for(const k of order){const r=fx[k]();if(r&&r!==s)return r}return null};

 if(type==='tf'){
  let stmt=s,ans='True';
  if(st.tf%2===1){
   const r=falsify(beg?['neg','ant','swap']:adv?['ant','num','swap2','swap','neg']:['swap','ant','num','neg']);
   if(r){stmt=r;ans='False'}
  }
  st.tf++;
  return {t:'tf',q:(adv?'Decide whether this statement is accurate: ':'True or False: ')+cap(stmt),a:ans,src:s,_k:T.k};
 }

 if(type==='mc'){
  /* Advanced: pick the one correct statement out of four near-identical ones */
  if(adv&&!c.frag&&s.length<=220&&st.adv++%2===0){
   const wrong=[],seen=new Set([s]);
   for(const k of ['ant','num','neg','swap2','swap']){
    const r=fx[k]();if(r&&!seen.has(r)){seen.add(r);wrong.push(r)}
    if(wrong.length>=3)break;
   }
   if(wrong.length<3){
    for(const d of dis(T,3)){
     if(wrong.length>=3)break;
     const r=sub(s,T.k,d);if(r&&!seen.has(r)){seen.add(r);wrong.push(r)}
    }
   }
   if(wrong.length>=3)return {t:'mc',q:'Which of the following statements is correct?',ch:shuf([s,...wrong.slice(0,3).map(cap)]),a:s,src:s,_k:T.k};
  }
  if(D){
   const od=A.defs.filter(x=>x.k!==D.k&&!x.def.toLowerCase().includes(T.k));
   const words=d=>d.toLowerCase().split(/\W+/).filter(Boolean);
   const dw=new Set(words(D.def));
   const sim=x=>{const b=words(x.def);return b.filter(w=>dw.has(w)).length/(b.length+1)};
   const lenD=x=>Math.abs(x.def.length-D.def.length);
   if(!beg&&od.length>=3&&(adv||st.mc++%2===0)){
    const pick=(adv?od.sort((a,b)=>sim(b)-sim(a)||lenD(a)-lenD(b)):od.sort((a,b)=>lenD(a)-lenD(b))).slice(0,6);
    const right=fmtDef(D.def),ds=shuf(pick).slice(0,3).map(x=>fmtDef(x.def));
    return {t:'mc',q:adv?`Which of the following most accurately describes ${T.disp}?`:`According to the lesson, which of the following best describes ${T.disp}?`,ch:shuf([right,...ds]),a:right,src:s,_k:T.k};
   }
   const ds=dis(T,nch);if(ds.length<nch)return null;
   const dq=blank(D.def,T.disp)||D.def;
   return {t:'mc',q:beg?`Which term means: “${dq}”?`:`Which term matches this description: “${dq}”?`,ch:shuf([cap(T.disp),...ds.map(cap)]),a:cap(T.disp),src:s,_k:T.k};
  }
  const b=blank(s,T.disp);if(!b)return null;
  const ds=dis(T,nch);if(ds.length<nch)return null;
  const lead=beg?'Fill in the blank: ':adv?'Choose the term that correctly completes the statement: ':'Choose the term that best completes the sentence: ';
  return {t:'mc',q:lead+b,ch:shuf([cap(T.disp),...ds.map(cap)]),a:cap(T.disp),src:s,_k:T.k};
 }

 /* identification */
 if(D){
  const dq=blank(D.def,T.disp)||D.def;
  return {t:'id',q:(beg?'What term means: ':adv?'Name the term that fits this description: ':'What term is described here: ')+`“${dq}”?`,a:T.disp,src:s,_k:T.k};
 }
 const b=blank(s,T.disp);if(!b)return null;
 return {t:'id',q:(adv?'Provide the missing term: ':'Fill in the blank: ')+b,a:T.disp,src:s,_k:T.k};
}

function generate(text,n,types,level){
 const lvl=LEVELS.includes(level)?level:'Intermediate',A=analyze(text);
 /* difficulty decides WHICH parts of the lesson are used */
 const rank=c=>c.score+(lvl==='Beginner'
  ?(c.def?3:0)+(c.s.length<130?2:c.s.length>180?-3:-1)+Math.min(c.terms[0].w,6)*0.3
  :lvl==='Advanced'
  ?(c.terms.length>=3?2:c.terms.length>=2?1:0)+(c.s.length>=100?2:-1.5)+(/\d/.test(c.s)?1.5:0)+(c.def?-1.5:0)
  :0);
 const st={tf:Math.floor(Math.random()*2),mc:0,adv:0},out=[],used=new Set(),topicN={};
 /* spread the questions over different concepts and different parts of the lesson */
 for(const strict of [true,false]){
  let pool=A.cands.filter(c=>!out.some(o=>o.idx===c.idx));
  while(out.length<n&&pool.length){
   let best=null,bs=-1e9;
   for(const c of pool){
    const k1=c.terms[0].k;
    if(strict&&used.has(k1))continue;
    const pen=(used.has(k1)?4:0)+(c.topic?2*(topicN[c.topic]||0):0)
     +c.terms.slice(0,3).filter(t=>used.has(t.k)).length*1.2+(out.some(o=>Math.abs(o.idx-c.idx)<=1)?2:0);
    const sc=rank(c)-pen;
    if(sc>bs){bs=sc;best=c}
   }
   if(!best)break;
   pool=pool.filter(c=>c!==best);
   for(let k=0;k<types.length;k++){
    const q=mk(best,types[(out.length+k)%types.length],lvl,A,st);
    if(q){
     out.push({q,idx:best.idx});used.add(q._k);
     best.terms.slice(0,2).forEach(t=>used.add(t.k));
     topicN[best.topic]=(topicN[best.topic]||0)+1;break;
    }
   }
  }
 }
 out.sort((a,b)=>a.idx-b.idx);
 const qs=out.map(o=>{const {_k,...q}=o.q;return q});
 let note='';
 if(!qs.length)note='Could not find enough lesson content to build questions. Make sure the lesson text is not only headings or a worksheet header.';
 else if(qs.length<n)note=`Only ${qs.length} good question(s) could be built from this lesson (you asked for ${n}). Add more lesson text for more.`;
 return {qs,note,concepts:A.concepts};
}

/* answers are compared ignoring case, punctuation, a leading "a/an/the" and a trailing plural "s" */
const norm=s=>{let t=String(s??'').toLowerCase().replace(/[“”"'’.,;:!?()]/g,'').replace(/^(a|an|the)\s+/,'').replace(/\s+/g,' ').trim();return t.length>3?t.replace(/s$/,''):t};
function grade(act,ans){let sc=0;act.qs.forEach((q,i)=>{if(norm(ans[i])===norm(q.a))sc++});return sc}

function fileKind(f){
 const e=((f.name||'').split('.').pop()||'').toLowerCase();
 if(e==='pdf')return 'pdf';
 if(e==='docx')return 'docx';
 if(['png','jpg','jpeg','gif','webp','bmp','svg'].includes(e)||(f.type||'').startsWith('image/'))return 'img';
 if(['txt','md','csv','html','htm','json'].includes(e)||(f.type||'').startsWith('text/'))return 'txt';
 return 'other';
}
function dataUrlToBlob(u){
 const i=u.indexOf(','),h=u.slice(0,i),mime=(h.match(/:(.*?)(;|$)/)||[])[1]||'application/octet-stream';
 const bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);
 for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);
 return new Blob([a],{type:mime});
}
function cleanHtml(h){
 const d=new DOMParser().parseFromString(h,'text/html');
 d.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n=>n.remove());
 d.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)}));
 return d.body.innerHTML;
}

async function viewFile(id){

 if(!m||!m.fileMeta||!m.fileMeta.dataUrl){alert('This file was too large to attach. Only its text was saved.');return}

 const f=m.fileMeta,k=fileKind(f),blob=dataUrlToBlob(f.dataUrl),url=URL.createObjectURL(blob);
 const ov=document.createElement('div');ov.id='viewer';ov._url=url;
 ov.onclick=e=>{if(e.target===ov)closeViewer()};

 document.body.appendChild(ov);
 const vb=document.getElementById('vbody');
 try{
  if(k==='pdf')vb.innerHTML=`<iframe src="${url}" title="${esc(f.name)}"></iframe>`;
  else if(k==='img')vb.innerHTML=`<img src="${url}" alt="${esc(f.name)}">`;
  else if(k==='docx'){const r=await mammoth.convertToHtml({arrayBuffer:await blob.arrayBuffer()});vb.innerHTML='<div class="doc">'+cleanHtml(r.value)+'</div>'}
  else if(k==='txt'){const pre=document.createElement('pre');pre.textContent=await blob.text();vb.innerHTML='';vb.appendChild(pre)}
  else vb.innerHTML='<div class="doc">This file type cannot be previewed here. Use the Download button.</div>';
 }catch(e){console.error(e);vb.innerHTML='<div class="doc">Could not preview this file. Use the Download button.</div>'}
}

function Tracking(){

   });

   content += `<table><tr><th>Student</th><th>Done</th><th>Average</th><th>Missed</th><th>Last submitted</th><th>Status</th></tr>

 } : null;

 if (d) content += trackDetail(d, now);

}
function trackDetail(d,now){

/* ---------- File reading: extracts text for the quiz generator AND keeps the file so it can be opened on the page ---------- */
const MAX_ATTACH=600*1024; /* Firestore documents are limited to ~1 MiB; base64 adds ~33% */
const setStat=t=>{const e=document.getElementById('fstat');if(e)e.textContent=t};
const readAs=(f,m)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r[m](f)});
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function ocr(src){
 if(!window.Tesseract)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js');
 return (await Tesseract.recognize(src,'eng')).data.text;
}
async function pdfToText(buf){
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,out=[];
 for(let p=1;p<=pdf.numPages;p++){
  const tc=await (await pdf.getPage(p)).getTextContent();
  let line='',y=null;
  tc.items.forEach(it=>{
   const yy=Math.round(it.transform[5]);
   if(y!==null&&Math.abs(yy-y)>2){out.push(line.trim());line=''}
   line+=it.str+' ';y=yy;
  });
  out.push(line.trim());out.push('');
 }
 return out.join('\n');
}
async function pdfOcr(buf){
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,out=[];
 for(let p=1;p<=Math.min(pdf.numPages,8);p++){
  setStat('Running OCR on page '+p+'...');
  const pg=await pdf.getPage(p),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');
  cv.width=vp.width;cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  out.push(await ocr(cv));
 }
 return out.join('\n\n');
}
function htmlToText(h){
 const d=new DOMParser().parseFromString(h,'text/html');
 d.querySelectorAll('script,style,nav,header,footer').forEach(n=>n.remove());
 return d.body.textContent||'';
}
async function readFile(inp){
 const f=inp.files[0];
 if(!f)return;
 const ext=(f.name.split('.').pop()||'').toLowerCase();
 if(!val('mt'))document.getElementById('mt').value=f.name.replace(/\.[^.]+$/,'');
 const meta={name:f.name,size:f.size,type:f.type||''};
 let text='',notes=[];
 uploadedFileMeta=null;fileBusy=true;
 try{
  setStat('Reading file...');
  if(ext==='pdf'){
   const buf=await readAs(f,'readAsArrayBuffer');
   text=await pdfToText(buf);
   if(text.replace(/\s/g,'').length<40){setStat('No text layer found, running OCR (first 8 pages)...');text=await pdfOcr(buf)}
  }else if(ext==='docx'){
   text=(await mammoth.extractRawText({arrayBuffer:await readAs(f,'readAsArrayBuffer')})).value;
  }else if(['txt','md','csv','html','htm','json'].includes(ext)||(f.type||'').startsWith('text/')){
   text=await readAs(f,'readAsText');
   if(ext==='html'||ext==='htm')text=htmlToText(text);
  }else if((f.type||'').startsWith('image/')){
   setStat('Reading text from the image (OCR)...');
   text=await ocr(f);
  }
  if(f.size<=MAX_ATTACH)meta.dataUrl=await readAs(f,'readAsDataURL');
  else notes.push('File is over '+Math.round(MAX_ATTACH/1024)+' KB, so only its text will be saved (it cannot be opened later).');
 }catch(e){
  console.error(e);
  notes.push('Could not fully read this file: '+(e.message||e));
 }
 text=text.trim();
 if(text){const mx=document.getElementById('mx');if(mx)mx.value=text}
 else notes.push('No readable text found. Paste the lesson text below so quizzes can be generated.');
 setStat((text?'Ready: extracted '+text.length+' characters. ':'')+notes.join(' '));
 uploadedFileMeta=meta;fileBusy=false;
}

function addMat(){
 if(fileBusy){alert('Still reading the file, please wait a moment.');return}
 const t=val('mt').trim(),x=val('mx').trim();
 if(!t || (!x && !uploadedFileMeta)){alert('Add a title and either lesson text or a file.');return}
 if(!val('ms')){alert('Create a section first.');return}

  const meta={...uploadedFileMeta};
  /* keep the whole document safely under Firestore's 1 MiB limit */
  if(new Blob([x]).size+(meta.dataUrl?meta.dataUrl.length:0)>900000){
   delete meta.dataUrl;
   alert('The file plus its text is too large to attach, so only the text was saved.');
  }
  payload.fileMeta = meta;
 }
 
 col('materials').add(payload).then(()=>{
  uploadedFileMeta = null;
  render();
 }).catch(fail);
}

<script>
/* LearnITAll add-on: math equations/functions, word problems, inline images.
   Add-on: paste in its own script tag after the main script. */

/* ---------- 1. Math reader: normalizer + safe evaluator (no eval) ---------- */
const MFN={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp};
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function normMath(s){
 return String(s||'').replace(/[−–—]/g,'-').replace(/[×·∙⋅]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi')
  .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'($1)/($2)').replace(/\\(cdot|times)/g,'*').replace(/\\(left|right)/g,'').replace(/[{}$]/g,m=>m==='$'?'':m==='{'?'(':')')
  .replace(/√\s*(\([^)]*\)|[\w.]+)/g,(m,a)=>'sqrt('+a.replace(/^\(|\)$/g,'')+')')
  .replace(new RegExp('['+SUP+']+','g'),m=>'^'+[...m].map(c=>SUP.indexOf(c)).join(''))
  .replace(/\*\*/g,'^').replace(/(\d),(?=\d{3}\b)/g,'$1');
}
function mTok(s){
 const T=[];
 (normMath(s).match(/\d+\.?\d*|\.\d+|[a-zA-Z]+|[-+*\/^()]/g)||[]).forEach(x=>{
  if(/^[a-zA-Z]+$/.test(x)&&x.length>1&&!MFN[x.toLowerCase()]&&x.toLowerCase()!=='pi')[...x].forEach(c=>T.push(c));else T.push(x);
 });
 return T;
}
const mVars=s=>[...new Set(mTok(s).filter(t=>/^[a-z]$/i.test(t)&&t.toLowerCase()!=='e').map(t=>t.toLowerCase()))];
function mEval(s,vars={}){
 const T=mTok(s);let p=0;
 const expr=()=>{let v=term();while(T[p]==='+'||T[p]==='-'){const o=T[p++],r=term();v=o==='+'?v+r:v-r}return v};
 const term=()=>{let v=unary();for(;;){const t=T[p];
  if(t==='*'||t==='/'){p++;const r=unary();v=t==='*'?v*r:v/r}
  else if(t!==undefined&&t!==')'&&t!=='+'&&t!=='-')v*=unary(); /* implicit: 2x, 3(x+1) */

function mathItems(sc,lvl){

 sc.funcs.forEach(f=>{
  const F=x=>mEval(f.body,{[f.v]:x});
  const poly=safe(()=>{const v=[0,1,2,3,4,5,6].map(F);
   return Math.abs(v[5]-5*v[4]+10*v[3]-10*v[2]+5*v[1]-v[0])<1e-6&&Math.abs(v[6]-5*v[5]+10*v[4]-10*v[3]+5*v[2]-v[1])<1e-6?1:null});
  for(let k=0;k<3;k++){const a=R(lo,hi),val=safe(()=>F(a));
   if(val!==null)out.push({q:`Given ${f.line}, find ${f.name}(${a}).`,s:`Given ${f.line}, ${f.name}(${a}) = `,val})}
  if(poly&&lvl==='Advanced'){const a=R(lo,hi),h=1e-3,val=safe(()=>(F(a+h)-F(a-h))/(2*h));

function exprDistractors(e){

 if(nm.length>=2){const x=nm[0],y=nm[nm.length-1];out.add(e.slice(0,x.index)+y[0]+e.slice(x.index+x[0].length,y.index)+x[0]+e.slice(y.index+y[0].length))}

  const F=it.fm||fmt,t=types[i%types.length],a=F(it.val),hint=Number.isInteger(+a)?'':a.includes('/')?' (fraction or decimal)':' (round to 3 decimals)';
  if(it.e&&t==='mc'&&Math.random()<.5){ /* "translate" question: pick the right expression */
   const ds=exprDistractors(it.e).slice(0,3);
   if(ds.length===3)return {t:'mc',q:it.q+' Which expression translates this problem?',ch:shuf([it.e,...ds]),a:it.e};
  }

   if(ds.length===3)return {t:'mc',q:it.q+hint,ch:shuf([a,...ds]),a};

}

/* replaces gen(): math lines -> math questions, everything else -> your existing text generator */
function gen(){

/* numeric answers: 4 = 4.0 = "x = 4" = 8/2 (tolerance 0.01); everything else uses your old comparison */

/* ---------- 4. Word equations (OMML) are skipped by mammoth, so read them from the .docx XML ---------- */
async function docxMath(file){

  switch(L(n)){

/* ---------- 6. Word-problem solver: translates a sentence into an expression and solves it ---------- */

 if((m=L.match(/(\d+)\/(\d+) of a job in (\d+) days?\.\s*how much (?:per day|in 1 day)/)))return R(`(${m[1]}/${m[2]}) ÷ ${m[3]}`,m[1]/m[2]/m[3]);

}

 <script>
/* LearnITAll add-on: level locking with 75% pass mark + activities under each lesson */
const PASS=0.75;
const passed=s=>!!s&&s.total>0&&s.score/s.total>=PASS;
const mySub=a=>S.subs.find(s=>s.act===a.id&&s.student===me.id);

/* a level is done when every activity of that level in that class is submitted AND passed (>= 75%) */
function levelDone(sec,lvl){

}
function lockedBy(sec,lvl){

}

function actCard(a){

 <div class="mu">${esc(secName(a.section))} &middot; ${a.qs.length} questions &middot; due ${a.due?new Date(a.due).toLocaleString():'no deadline'}</div>${st}</div>`;
}

function Lessons(){

 return LEVELS.map(l=>{const ms=mine.filter(m=>m.level===l);
  return ms.length?`<div class="card"><h2>${l}</h2>${ms.map(m=>{
  const lk=lockedBy(m.section,l);
  if(lk)return `<div class="q" style="opacity:.7">🔒 <b>${esc(m.title)}</b> <span class="mu">&middot; ${esc(secName(m.section))}</span>
   <div class="mu">Locked. Pass all ${lk} activities (75%+) in this class to unlock.</div></div>`;
  /* activities linked to this lesson; older activities with no link show under the lessons of the same class and level */
  const acts=S.activities.filter(a=>a.section===m.section&&a.level===m.level&&(a.mat?a.mat===m.id:true));
  return `<div class="q"><b>${esc(m.title)}</b> <span class="mu">&middot; ${esc(secName(m.section))}</span>
  ${fileBar(m)}
  ${m.fileMeta&&m.text?`<details style="margin-top:8px"><summary class="mu" style="cursor:pointer">Show lesson text</summary><p style="white-space:pre-wrap">${esc(m.text)}</p></details>`:`<p style="white-space:pre-wrap">${esc(m.text||'')}</p>`}
  <h3 style="margin-top:14px">Activities for this lesson</h3>
  ${acts.map(actCard).join('')||'<p class="mu">No activities for this lesson yet.</p>'}
  </div>`}).join('')}</div>`:''}).join('')||'<div class="card">No lessons in your classes yet.</div>';
}

function StudentActs(){
 const ids=S.mine.map(m=>m.section),mine=S.activities.filter(a=>ids.includes(a.section));
 return `<div class="card"><h2>Activities</h2>${mine.map(actCard).join('')||'<p class="mu">Nothing published to your classes yet.</p>'}</div>`;
}

function startAct(id){
 const a=S.activities.find(x=>x.id===id);
 if(!a||lockedBy(a.section,a.level)){msg='Finish the previous level first (75% or higher on every activity).';render();return}
 const sub=mySub(a);
 if(passed(sub)){msg='You already passed this activity.';render();return}
 if(!sub&&a.due&&new Date(a.due)<new Date()){msg='The deadline for this activity has passed.';render();return}
 taking=id;render();
}

/* submit: a failed attempt can be retaken (the new score replaces the old one); a passed one cannot */
function submitAct(){
 const a=S.activities.find(x=>x.id===taking);
 if(passed(mySub(a))){taking=null;render();return}
 const ans=a.qs.map((q,i)=>{
  if(q.t==='id')return document.querySelector(`[name=q${i}]`).value;
  const c=document.querySelector(`[name=q${i}]:checked`);return c?c.value:'';});
 const score=grade(a,ans);
 col('subs').doc(a.id+'_'+me.id).set({act:a.id,section:a.section,student:me.id,answers:ans,score,total:a.qs.length,at:Date.now()}).catch(fail);
 taking=null;tab='My Scores';render();
}

/* link each new quiz to the lesson it was generated from */
const _gen=window.gen;
window.gen=function(){const id=val('gm');_gen();if(draft)draft.mat=id};
function publish(){
 draft.title=val('at');draft.level=val('al');draft.section=val('as');draft.due=val('ad');
 const d=draft;draft=null;tab='Activities';
 col('activities').add({title:d.title,level:d.level,section:d.section,due:d.due,mat:d.mat||null,qs:d.qs.map(({src,...q})=>q)}).catch(fail);render();
}
</script>
</script><script>
/* LearnITAll add-on: Performance Task (teacher-graded with a rubric, only when the lesson fits) */
let ptDraft=null;
const PT_ACT=/\b(solve|compute|calculate|construct|draw|design|build|prepare|apply|demonstrate|perform|measure|experiment|program|operate|assemble|simulate|procedure|method)\w*/gi;
const ptTot=p=>((p&&p.rubric)||[]).reduce((s,r)=>s+(+r.pts||0),0);
const ptLink=u=>/^https?:\/\//i.test(u||'');

/* ---------- decide if the lesson fits a performance task, then build it ---------- */
function ptBuild(text,lvl){
 const A=analyze(text),C=A.concepts.slice(0,3),sc=scanMath(text);
 const nm=sc.funcs.length+sc.eqs.length+sc.exprs.length+sc.words.length;
 const st=text.split('\n').filter(l=>/^\s*(?:step\s*)?\d{1,2}[.):]\s+\S/i.test(l)).length;
 const act=(text.match(PT_ACT)||[]).length;
 const kind=nm?'math':st>=3?'process':act>=3?'general':'';
 if(!kind||C.length<2)return {na:1,why:'This lesson is mostly facts and definitions, so a performance task is not a good fit. Performance tasks work best for lessons with procedures, problem solving, or skills to apply. You can still use the quiz generator for it.'};
 const beg=lvl==='Beginner',adv=lvl==='Advanced',cs=C.join(', ');
 const topic=(A.cands.find(c=>c.topic&&c.topic.length<=60)||{}).topic||C[0];
 const T={
  math:beg?['Make 3 problems about '+topic+' using ideas from the lesson ('+cs+').','Solve each problem and show every step.','Check each answer and write how you checked it.']
   :adv?['Make 5 problems about '+topic+' that get harder, using ideas from the lesson ('+cs+').','Solve each one with complete steps and justify the method you chose.','Include one common mistake: show it, explain why it is wrong, and correct it.']
   :['Make 4 problems about '+topic+' using ideas from the lesson ('+cs+'), including one real-life situation.','Solve each problem and show every step.','Explain why each step works and check your answers.'],
  process:beg?['Write the steps for '+topic+' in order.','Add one example, sketch or photo.','Add one tip to avoid a common mistake.']
   :adv?['Perform or document the procedure for '+topic+' step by step.','Compare it with another possible method and decide which works better.','Explain possible errors, how to spot them, and how to fix them.']
   :['Perform or document the procedure for '+topic+' step by step.','Explain the purpose of each step.','Apply the procedure to a real situation of your choice and show the result.'],
  general:beg?['Explain '+cs+' in your own words.','Give one real-life example for each.','Make your output neat and organized (write-up, poster or slides).']
   :adv?['Analyze how '+cs+' are related.','Evaluate a real situation or case using these ideas.','Defend your conclusion with evidence from the lesson.']
   :['Explain '+cs+' and show how they are related.','Show a real-life application of each.','Choose a format (write-up, poster or slides) and make it clear and organized.']
 }[kind];
 const G={
  math:{role:'a peer tutor preparing a worked-solutions sheet',situation:'Your classmates need help with '+topic+'.',product:'Problem set with complete solutions'},
  process:{role:'a trainer who must teach others this procedure',situation:'A new learner must follow your guide to do '+topic+' correctly.',product:'Step-by-step guide with an example'},
  general:{role:'a class reporter explaining the topic',situation:'Your class is preparing a short presentation on '+topic+'.',product:'Explainer (write-up, poster or slides)'}
 }[kind];
 return {pt:{goal:'Show what you learned about '+topic+'.',role:G.role,audience:'Your classmates and teacher',situation:G.situation,product:G.product,task:T,rubric:[
  {c:'Content accuracy',pts:5,d:'Ideas from the lesson ('+cs+') are correct and used properly.'},
  {c:'Completeness',pts:5,d:kind==='math'?'Every problem is solved and every step is shown.':'All parts of the task are done.'},
  {c:beg?'Examples':adv?'Reasoning':'Application',pts:5,d:beg?'Clear, correct examples are given.':adv?'Choices are justified and mistakes or alternatives are analyzed.':'Ideas are applied correctly to a real situation.'},
  {c:'Organization and clarity',pts:5,d:'Work is neat, in order, and easy to follow.'}]}};
}

/* ---------- teacher: generate / edit / publish (card added under Create Quiz) ---------- */
function ptGen(){
 const m=S.materials.find(x=>x.id===val('ptcm'));if(!m){alert('Upload a lesson first.');return}
 const text=(m.text||'').trim();
 if(!text){alert('This lesson has no readable text. Paste the lesson text, or upload a file that contains text.');return}
 const lvl=val('ptcl')||m.level,r=ptBuild(text,lvl);
 ptDraft=r.na?{na:1,why:r.why,mat:m.id}:{mat:m.id,title:m.title+' Performance Task',level:lvl,section:m.section,due:'',pt:r.pt};
 render();
}
function ptEditor(V){
 const d=ptDraft,p=d.pt,t=ptTot(p);
 const fld=(l,k)=>`<label>${l}</label><textarea style="min-height:56px" onchange="ptDraft.pt.${k}=this.value">${esc(p[k])}</textarea>`;
 return `<h3 style="margin-top:16px">Preview &amp; edit</h3>
 <label>Title</label><input value="${esc(d.title)}" onchange="ptDraft.title=this.value">
 <div class="row"><div><label>Level</label><select onchange="ptDraft.level=this.value">${LEVELS.map(l=>`<option ${l===d.level?'selected':''}>${l}</option>`).join('')}</select></div>
 <div><label>Publish to section</label><select onchange="ptDraft.section=this.value">${V.sections.map(s=>`<option value="${s.id}" ${s.id===d.section?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
 <div><label>Deadline</label><input type="datetime-local" value="${esc(d.due||'')}" onchange="ptDraft.due=this.value"></div></div>
 ${fld('Goal','goal')}${fld('Role','role')}${fld('Audience','audience')}${fld('Situation','situation')}${fld('Product / output','product')}
 <label>Task steps (one per line)</label><textarea style="min-height:110px" onchange="ptDraft.pt.task=this.value.split('\\n').filter(s=>s.trim())">${esc(p.task.join('\n'))}</textarea>
 <h3 style="margin-top:14px">Rubric</h3>
 ${p.rubric.map((r,i)=>`<div class="row" style="align-items:end"><div><label>Criterion</label><input value="${esc(r.c)}" onchange="ptDraft.pt.rubric[${i}].c=this.value"></div>
 <div><label>Points</label><input type="number" min="1" value="${r.pts}" onchange="ptDraft.pt.rubric[${i}].pts=Math.max(1,+this.value||1);render()"></div>
 <div><label>What full points look like</label><input value="${esc(r.d)}" onchange="ptDraft.pt.rubric[${i}].d=this.value"></div>
 <div><button class="btn s" onclick="ptDraft.pt.rubric.splice(${i},1);render()">Remove</button></div></div>`).join('')}
 <div class="mu" style="margin-top:8px">Total ${t} points. Students need 75% (${Math.ceil(t*PASS*10)/10} points) to pass.</div>
 <button class="btn s" onclick="ptDraft.pt.rubric.push({c:'New criterion',pts:5,d:''});render()">Add criterion</button>
 <button class="btn" onclick="ptPublish()">Save &amp; publish</button>`;
}
function ptCard(){
 const V=scoped();
 return `<div class="card"><h2>Performance task</h2>
 <p class="mu">Builds a hands-on task with a rubric from a lesson, only if the lesson fits (procedures, problem solving, skills to apply). You grade submissions yourself under Results.</p>
 <label>Lesson</label><select id="ptcm">${V.materials.map(m=>`<option value="${m.id}" ${ptDraft&&ptDraft.mat===m.id?'selected':''}>${esc(m.title)}</option>`).join('')}</select>
 <div class="row"><div><label>Difficulty</label><select id="ptcl"><option value="">Same as lesson level</option>${LEVELS.map(l=>`<option>${l}</option>`).join('')}</select></div></div>
 <button class="btn" onclick="ptGen()">Generate performance task</button>
 ${ptDraft&&ptDraft.na?`<div class="mu bad" style="margin-top:8px">${esc(ptDraft.why)}</div>`:ptDraft?ptEditor(V):''}</div>`;
}
function ptPublish(){
 const d=ptDraft;if(!d||!d.pt)return;
 const total=ptTot(d.pt);
 if(!String(d.title||'').trim()||!d.pt.rubric.length||!total||!d.pt.task.length){alert('Add a title, at least one task step, and at least one rubric criterion.');return}
 col('activities').add({title:d.title.trim(),level:d.level,section:d.section,due:d.due||'',mat:d.mat,kind:'pt',qs:[],pt:{...d.pt,total}}).catch(fail);
 ptDraft=null;tab='Activities';render();
}
const _ptCQ=window.CreateQuiz;
window.CreateQuiz=function(){return _ptCQ()+ptCard()};

/* teacher lists */
window.Activities=function(){
 const V=scoped();
 return `<div class="card"><h2>Activities</h2>${V.activities.map(a=>`<div class="q"><span class="tag">${esc(a.level)}</span>${a.kind==='pt'?'<span class="tag" style="background:var(--ok)">Performance task</span>':''}<b>${esc(a.title)}</b>
 <div class="mu">${esc(secName(a.section))} &middot; ${a.kind==='pt'?ptTot(a.pt)+' points':a.qs.length+' questions'} &middot; due ${a.due?new Date(a.due).toLocaleString():'no deadline'}</div>
 <button class="btn d" onclick="delAct('${a.id}')">Delete</button></div>`).join('')||'<p class="mu">No activities yet.</p>'}</div>`;
};
/* submissions waiting for grading are kept out of averages and the normal results table */
const _ptScoped=window.scoped;
window.scoped=function(){const v=_ptScoped();v.subs=v.subs.filter(x=>!x.pending);return v};

/* ---------- teacher: grade with the rubric (shown at the top of Results) ---------- */
function ptGradeCard(){
 const ids=S.hosted.map(s=>s.id),acts=S.activities.filter(a=>a.kind==='pt'&&ids.includes(a.section));
 if(!acts.length)return '';
 const rows=S.subs.filter(x=>acts.some(a=>a.id===x.act)).sort((a,b)=>(b.pending?1:0)-(a.pending?1:0)||(b.at||0)-(a.at||0));
 return `<div class="card"><h2>Performance tasks to grade</h2>${rows.map(x=>{
  const a=acts.find(q=>q.id===x.act),u=S.students.find(s=>s.id===x.student&&s.section===x.section),R=a.pt.rubric||[];
  const ans=(x.answers||[])[0]||'',lk=(x.answers||[])[1]||'';
  return `<details class="q" ${x.pending?'open':''}><summary style="cursor:pointer"><b>${esc(u?u.name:'Student')}</b> <span class="mu">&middot; ${esc(a.title)} &middot; ${x.pending?'<span class="bad">Needs grading</span>':x.score+'/'+x.total+' graded'}</span></summary>
  <label>Student's answer</label><div style="white-space:pre-wrap;border:1px solid var(--br);border-radius:8px;padding:8px">${esc(ans)||'<span class="mu">(no text)</span>'}</div>
  ${lk?`<div class="mu" style="margin-top:6px">Link: ${ptLink(lk)?`<a href="${esc(lk)}" target="_blank" rel="noopener noreferrer">${esc(lk)}</a>`:esc(lk)}</div>`:''}
  <table><tr><th>Criterion</th><th>Score</th></tr>${R.map((r,i)=>`<tr><td><b>${esc(r.c)}</b><div class="mu">${esc(r.d)}</div></td><td style="width:110px"><input type="number" min="0" max="${r.pts}" step="0.5" id="pg_${x.id}_${i}" value="${x.marks&&x.marks[i]!=null?x.marks[i]:''}" placeholder="/ ${r.pts}"></td></tr>`).join('')}</table>
  <label>Feedback to student (optional)</label><textarea id="pf_${x.id}" style="min-height:60px">${esc(x.feedback||'')}</textarea>
  <button class="btn" onclick="ptSaveGrade('${x.id}')">Save grade</button></details>`}).join('')||'<p class="mu">No submissions yet.</p>'}</div>`;
}
function ptSaveGrade(id){
 const x=S.subs.find(s=>s.id===id),a=x&&S.activities.find(q=>q.id===x.act);if(!a)return;
 const R=a.pt.rubric||[],marks=R.map((r,i)=>{const v=parseFloat(document.getElementById('pg_'+id+'_'+i).value);return Number.isFinite(v)?Math.min(Math.max(v,0),r.pts):null});
 if(marks.some(m=>m===null)){alert('Enter a score for every criterion.');return}
 col('subs').doc(id).update({score:marks.reduce((s,v)=>s+v,0),total:R.reduce((s,r)=>s+r.pts,0),marks,feedback:document.getElementById('pf_'+id).value.trim(),pending:false,gradedAt:Date.now()}).catch(fail);
}
const _ptRes=window.Results;
window.Results=function(){return ptGradeCard()+_ptRes()};

/* ---------- student: card, task page, submit ---------- */
const _ptCard=window.actCard;
window.actCard=function(a){
 if(a.kind!=='pt')return _ptCard(a);
 const sub=mySub(a),late=a.due&&new Date(a.due)<new Date(),lk=lockedBy(a.section,a.level);
 const fb=sub&&sub.feedback?`<div class="mu">Teacher feedback: ${esc(sub.feedback)}</div>`:'';
 let st;
 if(lk)st=`<div class="mu">🔒 Locked. Pass all ${lk} activities (75%+) first.</div>`;
 else if(sub&&sub.pending)st=`<div class="mu">Submitted. Waiting for your teacher to grade it.</div><button class="btn s" onclick="startAct('${a.id}')">Edit submission</button>`;
 else if(sub&&passed(sub))st=`<div class="ok">Passed: ${sub.score}/${sub.total} (${Math.round(sub.score/sub.total*100)}%)</div>${fb}`;
 else if(sub)st=`<div class="bad">Not passed: ${sub.score}/${sub.total} (${Math.round(sub.score/sub.total*100)}%). You need 75% to continue.</div>${fb}<button class="btn" onclick="startAct('${a.id}')">Revise and resubmit</button>`;
 else if(late)st='<div class="bad">Deadline passed</div>';
 else st=`<button class="btn" onclick="startAct('${a.id}')">Start performance task</button>`;
 return `<div class="q"><span class="tag">${esc(a.level)}</span><span class="tag" style="background:var(--ok)">Performance task</span><b>${esc(a.title)}</b>
 <div class="mu">${esc(secName(a.section))} &middot; ${ptTot(a.pt)} points &middot; due ${a.due?new Date(a.due).toLocaleString():'no deadline'}</div>${st}</div>`;
};
const _ptTake=window.takeView;
window.takeView=function(){
 const a=S.activities.find(x=>x.id===taking);
 if(!a||a.kind!=='pt')return _ptTake();
 const p=a.pt,sub=mySub(a),R=p.rubric||[],old=(sub&&sub.answers)||[];
 return `<div class="card"><h2>${esc(a.title)}</h2><div class="mu">Performance task &middot; ${ptTot(p)} points &middot; 75% to pass</div>
 <table style="margin-top:8px"><tr><th>Goal</th><td>${esc(p.goal)}</td></tr><tr><th>Role</th><td>${esc(p.role)}</td></tr><tr><th>Audience</th><td>${esc(p.audience)}</td></tr><tr><th>Situation</th><td>${esc(p.situation)}</td></tr><tr><th>Product</th><td>${esc(p.product)}</td></tr></table>
 <h3 style="margin-top:14px">What you need to do</h3><ol>${p.task.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>
 <h3>How you will be graded</h3><table><tr><th>Criteria</th><th>Points</th></tr>${R.map(r=>`<tr><td><b>${esc(r.c)}</b><div class="mu">${esc(r.d)}</div></td><td>${r.pts}</td></tr>`).join('')}</table>
 <label>Your answer / explanation</label><textarea id="pta" style="min-height:160px">${esc(old[0]||'')}</textarea>
 <label>Link to your work (optional: Google Drive, YouTube, etc. Anyone with the link must be able to view it)</label><input id="ptk" value="${esc(old[1]||'')}">
 <button class="btn" onclick="submitAct()">Submit</button> <button class="btn s" onclick="taking=null;render()">Cancel</button></div>`;
};
const _ptSubmit=window.submitAct;
window.submitAct=function(){
 const a=S.activities.find(x=>x.id===taking);
 if(!a||a.kind!=='pt')return _ptSubmit();
 const t=document.getElementById('pta').value.trim(),k=document.getElementById('ptk').value.trim();
 if(!t&&!k){alert('Write your answer or add a link to your work.');return}
 if(k&&!ptLink(k)){alert('The link must start with http:// or https://');return}
 col('subs').doc(a.id+'_'+me.id).set({act:a.id,section:a.section,student:me.id,answers:[t,k],score:0,total:ptTot(a.pt),pending:true,at:Date.now()}).catch(fail);
 taking=null;tab='My Scores';render();
};
window.MyScores=function(){
 const mine=S.subs.filter(s=>s.student===me.id);
 return `<div class="card"><h2>My scores</h2><table><tr><th>Activity</th><th>Score</th></tr>
 ${mine.map(s=>{const a=S.activities.find(x=>x.id===s.act);return `<tr><td>${esc(a&&a.title)}</td><td>${s.pending?'<span class="mu">Awaiting grading</span>':s.score+'/'+s.total}</td></tr>`}).join('')||'<tr><td colspan=2 class="mu">No scores yet.</td></tr>'}</table></div>`;
};
</script>
